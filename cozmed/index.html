}]}},"כפפות ניטריל — שחור":{"he":{"tag":"100 יח | ללא לטקס/אבקה | 4 מיל","sections":[{"t":"איך להשתמש","items":["הזמינו את הגודל והעובי הדרוש לכם.","לבשו את הכפפות, והן יתאימו לצורת ידיכם.","התחילו בעבודה, בידיעה שאתם מוגנים במלואכם.","השליכו את הכפפות בצורה בטוחה לאחר השימוש."]},{"t":"תכונות עיקריות","items":["כפפות ניטריל מובילות למקסימום הגנה וביצועים.","עשויות מגומי סינתטי, ללא לטקס, אבקה או PVC.","עמידות במיוחד נגד נקבים, כימיקלים וחיידקים.","גמישות במיוחד, מספקות מיומנות מדויקת ותואמות למסכי מגע.","עיצוב אמבידקסטרי שמתאים בצורה נוחה לידיים."]},{"t":"על המוצר","items":["הגנה והיגיינה? הן בידיים שלכם עם כפפות הניטריל המקצועיות שלנו.","כפפות ניטריל מקצועיות הן פריט חיוני לשימוש יומיומי במגוון רחב של משימות – ולא רק למספרות. הן מספקות הגנה מעולה בעבודה ובבית, נגד חפצים חדים, כימיקלים וחיידקים. עשויות מגומי סינתטי, הן מתאימות לאנשים עם אלרגיה ללטקס. בנוסף, הכפפות נטולות אבקה כדי למנוע גירוי בעור ונטולות PVC כדי להתאים לעבודה עם מזון. העיצוב האמבידקסטרי נוח לעבודה מהירה, בעוד שהכפפות מתאימות לצורת הידיים להגנה ונוחות מירבית. הכפפות גמישות, מספקות מיומנות מדויקת ותואמות למסכי מגע, ומאפשרות לכם לעבוד ביעילות ובבטחה."]}]},"ar":{"tag":"100 قطعة | خالٍ من اللاتكس/البودرة | 4 مل","sections":[{"t":"طريقة الاستخدام","items":["اطلبوا المقاس والسماكة التي تحتاجونها.","ارتدوا القفازات، وستتلاءم مع شكل أيديكم.","ابدأوا العمل وأنتم تعلمون أنكم محميون بالكامل.","تخلصوا من القفازات بأمان بعد الاستخدام."]},{"t":"الميزات الرئيسية","items":["قفازات نتريل رائدة لأقصى حماية وأداء.","مصنوعة من مطاط صناعي، بلا لاتكس أو بودرة أو PVC.","مقاومة للغاية للثقب والمواد الكيميائية والجراثيم.","مرنة للغاية، تمنح براعة دقيقة ومتوافقة مع شاشات اللمس.","تصميم صالح لكلتا اليدين يلائم اليدين بشكل مريح."]},{"t":"عن المنتج","items":["الحماية والنظافة؟ هما بين أيديكم مع قفازات النتريل الاحترافية لدينا.","قفازات النتريل الاحترافية عنصر أساسي للاستخدام اليومي في مهام واسعة التنوع – وليس لصالونات الحلاقة فقط. توفر حماية ممتازة في العمل والبيت، ضد الأجسام الحادة والمواد الكيميائية والجراثيم. مصنوعة من مطاط ص       ? `<div class="flat"><div class="flat-p">${p.f} ₪</div><div class="flat-l">${s.per}</div></div>`
      : `<div class="tiers">${[3,6,12].map((k,i)=>
          `<div class="tier" data-tier="${p.id}-${i}" onclick="addTier(event,'${p.id}',${k})">
             <div class="tier-q">×${k}</div><div class="tier-p">${p.t[i]}</div></div>`).join('')}</div>`);
  const qty = p.out ? '' : `<div class="qty">
      <button onclick="adj('${p.id}',-1)" aria-label="-">&minus;</button>
      <input type="number" min="0" value="${q}" id="q-${p.id}" onchange="setQ('${p.id}',this.value)">
      <button onclick="adj('${p.id}',1)" aria-label="+">+</button>
      <span class="qty-sum" id="s-${p.id}"></span></div>`;
  const info = (p.info && PANELS[p.info])
    ? `<button class="pc-info" onclick="openInfo('${p.id}')">${T[L].more} ↓</button>` : '';
  return `<div class="pc${p.out?' sold':''}${q?' has':''}" id="c-${p.id}">
    <div class="pc-img" onclick="${p.info&&PANELS[p.info]?`openInfo('${p.id}')`:''}">
      <img src="${p.img}" alt="${esc(d.n)}" loading="lazy" decoding="async"></div>
    <div class="pc-body">
      <div class="pc-name">${esc(d.n)}</div>
      ${d.s?`<div class="pc-meta">${esc(d.s)}</div>`:''}
      ${p.r?`<div class="pc-retail">${s.retail}: <b>${p.r} ₪</b></div>`:''}
      ${info}${body}${qty}
    </div></div>`;
}

function build(){
  const nav=[], main=[];
  CATS.forEach((c,ci)=>{
    const id='cat'+ci, num=String(ci+1).padStart(2,'0');
    nav.push(`<a href="#${id}" data-nav="${id}">${esc(c[L])}</a>`);
    let inner='', grp=null, buf=[];
    const flush=()=>{ if(buf.length){ inner+=`<div class="grid">${buf.join('')}</div>`; buf=[]; } };
    c.items.forEach(p=>{
      const g = p.grp ? p.grp[L] : null;
      if(g!==grp){ flush(); if(g) inner+=`<div class="grp">${esc(g)}</div>`; grp=g; }
      buf.push(card(p));
    });
    flush();
    main.push(`<section class="sec" id="${id}">
      <div class="sec-head"><span class="sec-num">${L==='he'?'קטגוריה':'الفئة'} ${num}</span>
        <span class="sec-name">${esc(c[L])}</span>
        <span class="sec-sub">${esc(c[L==='he'?'heSub':'arSub'])} · ${c.items.length}</span></div>
      ${inner}</section>`);
  });
  document.getElementById('nav').innerHTML=nav.join('');
  document.getElementById('main').innerHTML=main.join('');
  Object.keys(Q).forEach(id=>{ if(BY[id]) line(id); });
  cart(true);
  spy();
}

/* ── quantities ── */
function addTier(ev, id, k){
  const p=BY[id]; if(p.out) return;
  Q[id]=(Q[id]||0)+k;
  const el=ev.currentTarget;
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  const r=el.getBoundingClientRect();
  const b=document.createElement('div');
  b.className='bump'; b.textContent='+'+k;
  b.style.left=(r.left+r.width/2)+'px'; b.style.top=(r.top-6)+'px';
  document.body.appendChild(b); setTimeout(()=>b.remove(),780);
  line(id); cart();
}
function adj(id,d){ setQ(id,(Q[id]||0)+d); }
function setQ(id,v){
  Q[id]=Math.max(0,parseInt(v)||0);
  const inp=document.getElementById('q-'+id); if(inp) inp.value=Q[id];
  line(id); cart();
}
function line(id){
  const p=BY[id], q=Q[id]||0;
  const inp=document.getElementById('q-'+id); if(inp && +inp.value!==q) inp.value=q;
  const el=document.getElementById('s-'+id); if(el) el.textContent = q ? nis(q*unit(p)) : '';
  const c=document.getElementById('c-'+id); if(c) c.classList.toggle('has', q>0);
  if(!p.f && !p.out){ const on=tierIdx(q);
    [0,1,2].forEach(i=>{ const t=document.querySelector(`[data-tier="${id}-${i}"]`); if(t) t.classList.toggle('on', i===on); }); }
}
function clearAll(){ Object.keys(Q).forEach(k=>delete Q[k]); save(); build(); }

/* המחירים במחירון כוללים מע״מ. הסכום שנצבר הוא הסכום לתשלום,
   והמע״מ מחולץ מתוכו לצורך התיעוד — לא מתווסף עליו. */
function totals(){
  let n=0, gross=0;
  for(const id in Q){ const p=BY[id], q=Q[id]||0; if(!p||!q) continue; n+=q; gross+=q*unit(p); }
  const ex=Math.round(gross/(1+VAT));
  return {n, gross, ex, vat:gross-ex};
}

let lastSub=0;
function cart(silent){
  const s=T[L], t=totals();
  save();
  document.getElementById('cart').classList.toggle('on', t.n>0);
  document.getElementById('hdrCart').classList.toggle('on', t.n>0);
  document.getElementById('hdrN').textContent=t.n;
  const nEl=document.getElementById('cN');
  nEl.textContent=t.n;
  if(!silent){ nEl.classList.add('pop'); setTimeout(()=>nEl.classList.remove('pop'),200); }
  document.getElementById('cVat').textContent=s.ofWhich+' '+nis(t.vat);
  countTo(document.getElementById('cSub'), lastSub, t.gross, silent);
  lastSub=t.gross;
}
function countTo(el, from, to, instant){
  if(instant || from===to || matchMedia('(prefers-reduced-motion:reduce)').matches){ el.textContent=nis(to); return; }
  const t0=performance.now(), dur=280;
  (function step(now){
    const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3);
    el.textContent=nis(Math.round(from+(to-from)*e));
    if(k<1) requestAnimationFrame(step);
  })(t0);
}

/* ── modals ── */
function openInfo(id){
  const p=BY[id], pan=PANELS[p.info]; if(!pan) return;
  const d=pan[L]||pan.he;
  document.getElementById('iTtl').textContent=p[L].n;
  document.getElementById('iBd').innerHTML=
    (d.tag?`<div class="i-tag">${esc(d.tag)}</div>`:'')+
    (d.sections||[]).map(s=>`<div class="i-sec"><h4>${esc(s.t)}</h4><ul>${
      (s.items||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join('');
  show('ovInfo');
}
function openOrder(){
  const s=T[L], t=totals(), rows=[];
  for(const id in Q){ const p=BY[id], q=Q[id]||0; if(!p||!q) continue;
    rows.push(`<div class="ord-row"><span>${esc(p[L].n)}${p[L].s?' · '+esc(p[L].s):''} × ${q}</span><b>${nis(q*unit(p))}</b></div>`); }
  document.getElementById('oList').innerHTML = rows.length?rows.join(''):`<div class="ord-row"><span>${s.empty}</span></div>`;
  document.getElementById('oSub').textContent=nis(t.ex);
  document.getElementById('oVat').textContent=nis(t.vat);
  document.getElementById('oTot').textContent=nis(t.gross);
  show('ovOrd');
}
function show(id){ document.getElementById(id).classList.add('on'); document.body.style.overflow='hidden'; }
function closeAll(){ document.querySelectorAll('.ov').forEach(o=>o.classList.remove('on')); document.body.style.overflow=''; }
addEventListener('keydown', e=>{ if(e.key==='Escape') closeAll(); });

/* ── send ── */
function sendWA(){
  const s=T[L], t=totals(); if(!t.n) return;
  const nl='\n', ln='—————————————';
  const nm=document.getElementById('fName').value.trim();
  const ph=document.getElementById('fPhone').value.trim();
  const nt=document.getElementById('fNote').value.trim();
  let m='🛒 *'+s.waTitle+'*'+nl+ln+nl;
  CATS.forEach(c=>{
    const rows=c.items.filter(p=>Q[p.id]);
    if(!rows.length) return;
    m+='*'+c[L]+'*'+nl;
    rows.forEach(p=>{ const q=Q[p.id];
      m+='• '+p[L].n+(p[L].s?' · '+p[L].s:'')+' — '+q+' '+s.waQty+' × '+unit(p)+'₪ = '+(q*unit(p)).toLocaleString('he-IL')+'₪'+nl; });
    m+=nl;
  });
  m+=ln+nl+s.exVat+': '+t.ex.toLocaleString('he-IL')+'₪'+nl+s.vat+': '+t.vat.toLocaleString('he-IL')+'₪'+nl;
  m+='💰 *'+s.totalIncl+': '+t.gross.toLocaleString('he-IL')+'₪* · '+t.n+' '+s.waQty+nl;
  if(nm||ph) m+=nl+s.waFrom+': '+[nm,ph].filter(Boolean).join(' · ')+nl;
  if(nt) m+=s.waNote+': '+nt+nl;
  window.open('https://wa.me/'+WA+'?text='+encodeURIComponent(m),'_blank');
}

/* ── nav highlight ── */
let obs;
function spy(){
  if(obs) obs.disconnect();
  const links=[...document.querySelectorAll('[data-nav]')];
  obs=new IntersectionObserver(es=>{
    es.forEach(e=>{ if(!e.isIntersecting) return;
      links.forEach(a=>a.classList.toggle('on', a.dataset.nav===e.target.id)); });
  },{rootMargin:'-30% 0px -65% 0px'});
  document.querySelectorAll('.sec').forEach(s=>obs.observe(s));
}

/* ── language ── */
function setLang(l){
  L=l;
  const h=document.documentElement;
  h.lang=l; h.dir='rtl';
  document.getElementById('bHe').classList.toggle('on', l==='he');
  document.getElementById('bAr').classList.toggle('on', l==='ar');
  document.title = l==='he' ? 'Cozmed Beauty | מחירון L3VEL3' : 'Cozmed Beauty | قائمة أسعار L3VEL3';
  document.querySelectorAll('[data-t]').forEach(el=>{ const k=el.dataset.t; if(T[l][k]!==undefined) el.innerHTML=T[l][k]; });
  build();
}

setLang('he');
</script>
