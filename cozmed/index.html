/* ── HEADER ── */
.hdr{position:sticky;top:0;z-index:120;background:rgba(10,10,13,.9);backdrop-filter:blur(16px);
     border-bottom:1px solid var(--line-w)}
.hdr-in{max-width:1180px;margin:0 auto;padding:0 20px;height:var(--hdr);display:flex;align-items:center;
        justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-chip{width:42px;height:42px;border-radius:11px;background:#14141A;border:1px solid rgba(198,160,74,.22);
            display:grid;place-items:center;flex:0 0 auto}
.brand-chip .lg{width:27px}
.brand-name{font-size:15px;font-weight:800;letter-spacing:.14em;line-height:1.15;color:#fff}
.brand-sub{font-size:9.5px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-top:2px}
.hdr-right{display:flex;align-items:center;gap:9px}
.lang{display:flex;border:1px solid rgba(255,255,255,.14);border-radius:99px;overflow:hidden;background:rgba(255,255,255,.04)}
.lang button{border:none;background:transparent;color:var(--muted);font-size:12px;font-weight:700;
             padding:7px 13px;cursor:pointer;transition:.2s var(--ease)}
.lang button.on{background:var(--gold);color:#0B0B0E}
.hdr-cart{display:none;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);
          border-radius:99px;padding:7px 13px;font-size:12.5px;font-weight:800;color:var(--text);cursor:pointer}
.hdr-cart.on{display:inline-flex}
.hdr-cart b{color:var(--gold-lt)}

/* ── HERO ── */
.hero{background:radial-gradient(ellipse 70% 90% at 50% 0%,rgba(198,160,74,.17) 0%,transparent 62%),var(--night);
      color:#fff;text-align:center;padding:54px 20px 60px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;inset:auto 0 0 0;height:1px;
             background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.55}
.hero-logo{width:142px;margin:0 auto 18px}
.hero-name{font-size:clamp(26px,5.4vw,40px);font-weight:900;letter-spacing:.16em;
  background:linear-gradient(180deg,var(--gold-lt),var(--gold-dp));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-sub{font-size:10.5px;letter-spacing:.42em;color:rgba(255,255,255,.48);text-transform:uppercase;margin-top:9px}
.hero-rule{width:52px;height:1px;background:var(--gold);opacity:.55;margin:22px auto}
.hero-title{font-size:clamp(15px,3vw,19px);color:rgba(255,255,255,.9);line-height:1.6}
.hero-title b{font-weight:800;color:#fff}
.pills{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.pill{font-size:11.5px;color:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.16);
      background:rgba(255,255,255,.05);padding:6px 14px;border-radius:99px}
.pill b{color:var(--gold-lt);font-weight:700}

/* ── NAV ── */
.nav{position:sticky;top:var(--hdr);z-index:110;background:rgba(10,10,13,.94);backdrop-filter:blur(14px);
     border-bottom:1px solid var(--line-w)}
.nav-in{max-width:1180px;margin:0 auto;padding:9px 20px;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
.nav-in::-webkit-scrollbar{display:none}
.nav a{flex:0 0 auto;font-size:12.5px;font-weight:700;color:var(--muted);text-decoration:none;
       padding:7px 14px;border-radius:99px;border:1px solid transparent;white-space:nowrap;transition:.22s var(--ease)}
.nav a:hover{color:var(--text);background:rgba(255,255,255,.05)}
.nav a.on{color:var(--gold-lt);background:var(--gold-wash);border-color:rgba(198,160,74,.34)}

/* ── SECTIONS ── */
.sec{padding:46px 0 4px;scroll-margin-top:calc(var(--hdr) + 56px)}
.sec-head{display:flex;align-items:flex-end;gap:13px;border-bottom:1px solid var(--line-w);padding-bottom:13px;margin-bottom:24px}
.sec-num{font-size:11px;font-weight:800;color:var(--gold-lt);letter-spacing:.16em;background:var(--gold-wash);
         border:1px solid rgba(198,160,74,.26);padding:5px 11px;border-radius:7px;white-space:nowrap}
.sec-name{font-size:21px;font-weight:800;letter-spacing:-.01em;color:var(--text)}
.sec-sub{font-size:12.5px;color:var(--muted);margin-inline-start:auto;text-align:end}
.grp{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.06em;margin:26px 0 12px;
     display:flex;align-items:center;gap:10px}
.grp::after{content:'';flex:1;height:1px;background:var(--line-s)}

/* ── CARD ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:16px}
.grid>*{min-width:0}
.pc{background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden;display:flex;
    flex-direction:column;box-shadow:var(--shadow);transition:box-shadow .25s var(--ease),border-color .25s var(--ease),transform .25s var(--ease);min-width:0;position:relative}
.pc:hover{box-shadow:var(--shadow-h);border-color:rgba(198,160,74,.46);transform:translateY(-2px)}
.pc.has{border-color:rgba(198,160,74,.6);box-shadow:0 0 0 1px rgba(198,160,74,.3),var(--shadow-h)}
.pc.sold{opacity:.6}
.pc-img{background:var(--tile);aspect-ratio:1;display:grid;place-items:center;padding:15px;cursor:pointer;
        overflow:hidden;margin:10px;border-radius:12px}
.pc-img img{max-height:100%;object-fit:contain;transition:transform .4s var(--ease)}
.pc:hover .pc-img img{transform:scale(1.05)}
.pc-body{padding:4px 14px 15px;display:flex;flex-direction:column;gap:9px;flex:1}
.pc-name{font-size:15px;font-weight:800;line-height:1.3;color:var(--text)}
.pc-meta{font-size:11.5px;color:var(--muted);line-height:1.45}
.pc-retail{font-size:11.5px;color:var(--muted)}
.pc-retail b{color:var(--soft);font-weight:700}
.pc-info{align-self:flex-start;font-size:11px;font-weight:700;color:var(--gold-lt);background:none;border:none;
         padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;opacity:.85}
.pc-info:hover{opacity:1}
.sold-badge{font-size:11px;font-weight:800;color:#E8897E;background:rgba(176,74,60,.14);
            border:1px solid rgba(176,74,60,.35);border-radius:8px;padding:8px;text-align:center;margin-top:auto}

/* ── TIERS (clickable) ── */
.tiers{display:flex;gap:6px;margin-top:auto}
.tier{flex:1;text-align:center;border:1px solid rgba(255,255,255,.09);border-radius:9px;padding:7px 3px;
      background:var(--chip);cursor:pointer;
      transition:transform .16s var(--ease),background .2s var(--ease),border-color .2s var(--ease);
      position:relative;-webkit-tap-highlight-color:transparent}
.tier:hover{border-color:var(--gold);background:#1E1E27}
.tier:active{transform:scale(.94)}
.tier.on{border-color:rgba(198,160,74,.6);background:var(--gold-wash)}
.tier.flash{animation:flash .45s var(--ease)}
@keyframes flash{0%{background:var(--gold);border-color:var(--gold)}100%{background:var(--gold-wash)}}
.tier-q{font-size:9.5px;color:var(--muted);letter-spacing:.05em}
.tier-p{font-size:15px;font-weight:800;margin-top:1px;color:var(--text)}
.tier.on .tier-p{color:var(--gold-lt)}
.flat{border:1px solid rgba(255,255,255,.09);border-radius:9px;background:var(--chip);padding:8px;text-align:center;margin-top:auto}
.flat-p{font-size:17px;font-weight:800;color:var(--text)}
.flat-l{font-size:9.5px;color:var(--muted);letter-spacing:.05em}

/* ── QTY ── */
.qty{display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.09);border-radius:10px;padding:5px 7px;min-width:0}
.qty button{width:28px;height:28px;border:1px solid rgba(255,255,255,.09);background:var(--chip);border-radius:7px;
            font-size:16px;font-weight:700;color:var(--soft);cursor:pointer;line-height:1;flex:0 0 auto;
            transition:.16s var(--ease);-webkit-tap-highlight-color:transparent}
.qty button:hover{border-color:var(--gold);color:var(--gold-lt)}
.qty button:active{transform:scale(.9)}
.qty input{flex:1;width:100%;min-width:0;border:none;text-align:center;font-family:inherit;font-size:15px;
           font-weight:800;color:var(--text);background:transparent;-moz-appearance:textfield}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.qty input:focus{outline:none}
.qty-sum{font-size:11px;color:var(--gold-lt);font-weight:800;white-space:nowrap;min-width:44px;text-align:center;
         flex:0 1 auto;overflow:hidden}

/* floating +N */
.bump{position:fixed;z-index:400;font-size:13px;font-weight:900;color:#0B0B0E;background:var(--gold);
      border-radius:99px;padding:4px 11px;pointer-events:none;box-shadow:0 6px 20px rgba(198,160,74,.45);
      animation:bump .75s var(--ease) forwards}
@keyframes bump{0%{opacity:0;transform:translate(-50%,0) scale(.7)}
                18%{opacity:1;transform:translate(-50%,-10px) scale(1.06)}
                100%{opacity:0;transform:translate(-50%,-52px) scale(.95)}}

/* ── CART ── */
.cart{position:fixed;inset-inline:0;bottom:0;z-index:130;background:rgba(12,12,16,.97);backdrop-filter:blur(18px);
      border-top:1px solid var(--line-w);box-shadow:0 -8px 34px rgba(0,0,0,.5);
      transform:translateY(115%);transition:transform .42s var(--ease);
      padding-bottom:env(safe-area-inset-bottom)}
.cart.on{transform:translateY(0)}
.cart-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.cart-n{font-size:12px;color:var(--muted)}
.cart-n b{color:var(--text);font-size:16px;font-weight:900;display:inline-block;transition:transform .2s var(--ease)}
.cart-n b.pop{transform:scale(1.28)}
.cart-t{margin-inline-start:auto;text-align:end;line-height:1.25}
.cart-t-l{font-size:10.5px;color:var(--muted)}
.cart-t-v{font-size:20px;font-weight:900;letter-spacing:-.02em;color:var(--text)}
.cart-vat{font-size:10.5px;color:var(--gold-lt);font-weight:700}
.btn{border:none;border-radius:11px;font-size:14px;font-weight:800;padding:12px 22px;cursor:pointer;
     transition:.2s var(--ease);display:inline-flex;align-items:center;gap:8px;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.97)}
.btn-wa{background:var(--wa);color:#fff}
.btn-wa:hover{background:#1a9748}
.btn-gh{background:transparent;color:var(--muted);border:1px solid rgba(255,255,255,.14);font-weight:600;padding:11px 15px}
.btn-gh:hover{color:var(--text);border-color:rgba(255,255,255,.3)}

/* ── MODALS ── */
.ov{position:fixed;inset:0;z-index:500;background:rgba(4,4,6,.7);backdrop-filter:blur(5px);
    display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.ov.on{opacity:1;pointer-events:auto}
@media(min-width:721px){.ov{align-items:center}}
.sheet{background:var(--card);border:1px solid var(--line);width:100%;max-width:620px;max-height:88vh;overflow-y:auto;
       border-radius:18px 18px 0 0;transform:translateY(28px);transition:transform .34s var(--ease);
       padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:721px){.sheet{border-radius:18px}}
.ov.on .sheet{transform:translateY(0)}
.sh-hd{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line-w);padding:16px 20px;
       display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:2}
.sh-ttl{font-size:17px;font-weight:900;color:var(--text)}
.sh-x{width:32px;height:32px;border-radius:9px;border:1px solid rgba(255,255,255,.14);background:transparent;
      font-size:17px;color:var(--muted);cursor:pointer;line-height:1}
.sh-x:hover{color:var(--text);border-color:rgba(255,255,255,.3)}
.sh-bd{padding:18px 20px 22px}
.i-tag{font-size:13px;color:var(--gold-lt);font-weight:700;background:var(--gold-wash);border-radius:9px;
       padding:10px 13px;margin-bottom:16px;line-height:1.5}
.i-sec{margin-bottom:16px}
.i-sec h4{font-size:13px;font-weight:800;margin-bottom:7px;color:var(--text)}
.i-sec li{font-size:13px;color:var(--soft);line-height:1.72;margin-inline-start:17px}
.ord-row{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:9px 0;border-bottom:1px solid var(--line-s)}
.ord-row span{color:var(--soft)}
.ord-row b{white-space:nowrap;color:var(--text)}
.ord-sum{display:flex;justify-content:space-between;font-size:13.5px;padding:7px 0;color:var(--soft)}
.ord-sum b{color:var(--text)}
.ord-sum.big{font-size:17px;font-weight:900;border-top:1px solid var(--line-w);margin-top:8px;padding-top:12px;color:var(--text)}
.ord-sum.big b{color:var(--gold-lt)}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:5px}
.fld input{width:100%;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:11px 13px;font-family:inherit;
           font-size:14px;color:var(--text);background:#16161C}
.fld input:focus{outline:none;border-color:var(--gold);background:#1A1A21}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ── FOOTER ── */
.foot{margin-top:52px;background:#060608;border-top:1px solid var(--line-w);color:rgba(255,255,255,.62);
      text-align:center;padding:44px 20px}
.foot-logo{width:72px;margin:0 auto 14px}
.foot-name{color:#fff;font-weight:800;letter-spacing:.14em;font-size:14px}
.foot-l{font-size:12.5px;margin-top:9px;line-height:1.9}
.foot-l a{color:var(--gold-lt);text-decoration:none}
.foot-note{font-size:11px;color:rgba(255,255,255,.34);margin-top:16px;border-top:1px solid rgba(255,255,255,.09);padding-top:16px;line-height:1.7}

@media(max-width:640px){
  :root{--hdr:58px}
  .brand-name{font-size:13px}.brand-chip{width:38px;height:38px}.brand-chip .lg{width:24px}
  .sec-sub{display:none}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
  .pc-img{margin:8px;padding:11px;border-radius:10px}
  .pc-body{padding:3px 10px 12px;gap:7px}.pc-name{font-size:13.5px}
  .tier{padding:6px 2px}.tier-p{font-size:13px}.tier-q{font-size:9px}
  .qty{gap:4px;padding:4px 5px}.qty button{width:26px;height:26px}
  .qty-sum{min-width:0;font-size:10px}
  .cart-in{gap:10px;padding:10px 14px}.cart-t-v{font-size:17px}
  .btn{padding:11px 16px;font-size:13px}
  .two{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
  html{scroll-behavior:auto}
}

.","להשאיר 15-20 דקות.","לקלף בעדינות.","לשטוף ולמרוח קרם לחות."]},{"t":"טיפים מקצועיים","items":["אידיאלי ללקוחות עם עור רגיש או יבש.","לשימוש אחרי גילוח להרגעת גירוי.","מצוין כשירות פינוק משלים במספרה.","להציע לצד המסכה השחורה — הלקוח בוחר לפי סוג העור."]},{"t":"למה זה עובד","items":["הרגעה ולחות אחרי גילוח מפחיתות אדמומיות וגירוי ומשאירות את העור רך וזוהר. זהו סיום מפנק שמעלה את חוויית השירות."]}]},"ar":{"tag":"تركيبة لطيفة للترطيب والتهدئة والإشراق","sections":[{"t":"طريقة الاستخدام","items":["وزّعه على وجه نظيف.","اتركه 15-20 دقيقة.","انزعه بلطف.","اشطف وضع كريم ترطيب."]},{"t":"نصائح احترافية","items":["مثالي للزبائن ذوي البشرة الحساسة أو الجافة.","استخدمه بعد الحلاقة لتهدئة التهيّج.","ممتاز كخدمة تدليل مكملة في صالون الحلاقة.","اعرضه إلى جانب الماسك الأسود — الزبون يختار حسب نوع بشرته."]},{"t":"لماذا ينجح","items":["التهدئة والترطيب بعد الحلاقة يقللان الاحمرار والتهيّج ويتركان البشرة ناعمة ومشرقة. إنه إنهاء مدلّل يرفع مستوى تجربة الخدمة."]}]}},"מסכת בוץ פילינג":{"he":{"tag":"חימר קאולין · ניקוי עומק · פילינג","sections":[{"t":"אופן שימוש","items":["להרטיב היטב את העור.","למרוח את הסקראב בעזרת קצות האצבעות או מברשת מסכה.","לעסות בעדינות בתנועות סיבוביות.","להימנע מאזור העיניים העדין.","לשטוף במים פושרים ונקיים."]},{"t":"טיפים מקצועיים","items":["מתאימה לשימוש יומיומי.","שדרוג מצוין לשירות פנים או לפני/אחרי גילוח במספרה.","כלי מכירה נוח: תוצאה מורגשת מיד שמעודדת רכישה חוזרת."]},{"t":"למה זה עובד","items":["החימר סופג שומן וזיהומים ומנקה לעומק את הנקבוקיות, והפילינג מסיר תאי עור מתים — כך העור נראה נקי, מאוזן וחלק יותר כבר אחרי שימוש אחד."]}]},"ar":{"tag":"طين الكاولين · تنظيف عميق · تقشير","sections":[{"t":"طريقة الاستخدام","items":["بلّل البشرة جيداً.","وزّع المقشّر بأطراف الأصابع أو بفرشاة القناع.","دلّك بلطف بحركات دائرية.","تجنّب منطقة العينين الحساسة.","اشطف بماء فاتر ونظيف."]},{"t":"نصائح احترافية","items":["مناسبة للاستخدام اليومي.","إضافة ممتازة لخدمة الوجه أو قبل/بعد الحلاقة في الصالون.","أداة بيع سهلة: نتيجة ملموسة فوراً تشجّع على الشراء المتكرر."]},{"t":"لماذا ينجح","items":["الطين يمتص الدهون والشوائب وينظّف المسام بعمق، والتقشير يزيل خلايا الجلد الميتة — فتبدو البشرة أنظف وأكثر توازناً ونعومة من أول استخدام."]}]}},"סקראב לפנים-משמש":{"he":{"tag":"חלקיקי משמש טבעיים · פילינג עדין · מראה זוהר","sections":[{"t":"אופן שימוש","items":["להרטיב את העור במים פושרים.","להוציא כמות קטנה לקצות האצבעות.","לעסות בעדינות בתנועות סיבוביות.","להימנע מאזור העיניים העדין.","לשטוף את הפנים במים נקיים וקרירים."]},{"t":"טיפים מקצועיים","items":["עדין מספיק לשגרת טיפוח יומיומית.","מצוין כהכנת עור לפני גילוח לתחושת החלקה טובה יותר.","מתאים גם ללקוחות עם עור רגיש שמחפשים פילינג לא אגרסיבי."]},{"t":"למה זה עובד","items":["חלקיקי המשמש הטבעיים מקלפים בעדינות תאי עור מתים והצטברות מבלי לפגוע בעור, ולכן הפנים נראים נקיים, חלקים וזוהרים יותר — עם תחושת רעננות מיידית."]}]},"ar":{"tag":"حبيبات مشمش طبيعية · تقشير لطيف · مظهر مشرق","sections":[{"t":"طريقة الاستخدام","items":["بلّل البشرة بماء فاتر.","خذ كمية صغيرة على أطراف الأصابع.","دلّك بلطف بحركات دائرية.","تجنّب منطقة العينين الحساسة.","اشطف الوجه بماء نظيف وبارد."]},{"t":"نصائح احترافية","items":["لطيف بما يكفي لروتين عناية يومي.","ممتاز لتحضير البشرة قبل الحلاقة لانزلاق أفضل للشفرة.","مناسب أيضاً للزبائن ذوي البشرة الحساسة الباحثين عن تقشير غير قاسٍ."]},{"t":"لماذا ينجح","items":["حبيبات المشمش الطبيعية تقشّر بلطف خلايا الجلد الميتة والتراكمات دون إيذاء البشرة، لذلك يبدو الوجه أنظف وأنعم وأكثر إشراقاً — مع إحساس فوري بالانتعاش."]}]}},"מסכה ללא שטיפה":{"he":{"tag":"ללא אחיזה (טיפוח) · גימור טבעי · מתיר קשרים","sections":[{"t":"התאמה לסוגי שיער","items":["מיטבי לשיער ארוך, מתולתל וסבוך.","מצוין לילדים ולכל מי שמסתבך בקלות."]},{"t":"אופן שימוש","items":["לרסס על שיער לח או יבש.","להתמקד בקטעים הסבוכים.","לסרק בעדינות מהקצוות כלפי מעלה.","לעצב כרצונכם."]},{"t":"טיפים מקצועיים","items":["כלי עבודה שמזרז כל שירות — כדאי בכל עמדה.","חיוני ללקוחות עם שיער ארוך או מתולתל.","מוצר קמעונאי מצוין להורים לילדים."]}]},"ar":{"tag":"بلا تثبيت (عناية) · مظهر نهائي طبيعي · يفك التشابك","sections":[{"t": لى اللحية لإخفاء الشيب في شعر الوجه.","منتج تجزئة جيد للزبائن الذين يريدون صيانة اللون بين الزيارات."]}]}},"באלם לזקן":{"he":{"tag":"עיצוב קל, ריכוך וברק טבעי ללא שמנוניות","sections":[{"t":"אופן שימוש","items":["לקחת כמות קטנה בעזרת קצות האצבעות.","לחמם בין כפות הידיים עד שהחומר מתרכך ומתפזר.","למרוח על הזקן ולעבוד היטב פנימה לכל האורך.","לעצב לצורה הרצויה בעזרת הידיים.","לסרק במסרק זקן כאשר רוצים מראה מוגדר ומדויק יותר."]},{"t":"טיפים מקצועיים","items":["זהו שלב הסיום של שגרת זקן מלאה.","נותן מספיק אחיזה כדי לשמור על הזקן במקום לאורך היום.","אפשר להניח מעל שמן לזקן לקבלת לחות גבוהה יותר ושליטה טובה יותר.","מעולה לשמירה על שפם מסודר ובמקום."]},{"t":"למה זה עובד","items":["הבאלם מוסיף שכבת שליטה קלה שמיישרת את המראה בלי להקשיח. הוא מתאים במיוחד ללקוחות שרוצים זקן רך, מסודר ומטופח אבל עדיין טבעי למגע."]}]},"ar":{"tag":"تصفيف خفيف وتليين ولمعان طبيعي بلا دهنية","sections":[{"t":"طريقة الاستخدام","items":["خذ كمية صغيرة بأطراف الأصابع.","دفّئها بين راحتي اليدين حتى تليّن المادة وتنتشر.","وزّعها على اللحية وادفعها جيداً إلى الداخل على كامل الطول.","شكّل اللحية بالشكل المطلوب باليدين.","مشّط بمشط اللحية عند الرغبة بمظهر أوضح وأدقّ."]},{"t":"نصائح احترافية","items":["هذه هي مرحلة الختام في روتين لحية كامل.","يمنح تثبيتاً كافياً لإبقاء اللحية في مكانها طوال اليوم.","يمكن وضعه فوق زيت اللحية للحصول على ترطيب أعلى وتحكّم أفضل.","ممتاز للحفاظ على الشارب مرتّباً وفي مكانه."]},{"t":"لماذا ينجح","items":["يضيف البالم طبقة تحكّم خفيفة تنظّم المظهر دون تقسية. وهو مناسب خصوصاً للزبائن الذين يريدون لحية ليّنة ومرتّبة ومعتنى بها لكنها تبقى طبيعية عند اللمس."]}]}},"שמן לזקן":{"he":{"tag":"לחות, ריכוך וברק טבעי לשיער הפנים ולעור","sections":[{"t":"אופן שימוש","items":["להשתמש על זקן נקי ומעט לח.","לטפטף כמה טיפות לכף היד.","לחמם את השמן בין כפות הידיים.","לעבוד דרך הזקן ולהגיע גם לעור שמתחתיו.","לסרק לפיזור אחיד ולמראה מסודר."]},{"t":"טיפים מקצועיים","items":["כמה טיפות מספיקות. להתחיל בכמות קטנה ולהוסיף לפי צורך.","לעסות לתוך העור שמתחת לזקן כדי להפחית יובש.","שימוש יומיומי נותן את הת ת וניחוח נעים."]},{"t":"תכונות עיקריות","items":["עשויים מפלדת אל-חלד איכותית ועמידה לשימוש ארוך טווח.","מצופים פולימר לנוחות מוגברת ולהפחתת גירויים בעור.","חדות מרבית לגילוח מדויק ובטוח בכל שימוש.","מחליקים בצורה חלקה על העור, למניעת חתכים ואי-נוחות.","מארז של 100 להבים לאספקה ממושכת ולערך יוצא דופן."]},{"t":"על המוצר","items":["להבי הגילוח הדו-צדדיים של L3VEL3™ עשויים מפלדת אל-חלד עמידה ומצופים פולימר לנוחות מרבית. הלהבים מספקים גילוח חלק ובטוח, תוך הפחתת גירויים וחתכים. עם חדות מרשימה וביצועים עקביים, הם הבחירה המושלמת לכל מי שמחפש גילוח איכותי ומדויק. המארז הגדול של 100 להבים מבטיח שימוש ממושך ושקט נפשי."]}]},"ar":{"tag":"200 شفرة مزدوجة الحد | فولاذ مطلي بالبوليمر","sections":[{"t":"طريقة الاستخدام","items":["أمسكوا الشفرة بشكل مريح وضعوها بالزاوية المناسبة للحلاقة.","مرّروها بلطف على البشرة بحركات خفيفة، دون ضغط زائد.","بعد الاستخدام، اشطفوا الشفرة بالماء وجفّفوها للنظافة وإعادة الاستخدام.","يُنصح بدمجه مع…","لإكمال تجربة الحلاقة، استخدموا جل الحلاقة الشفاف من L3VEL3™ ، الذي يتيح رؤية دقيقة للمناطق المحلوقة. بعد ذلك، استخدموا كولونيا ما بعد الحلاقة فروست لتهدئة البشرة ولإضافة انتعاش ورائحة لطيفة."]},{"t":"الميزات الرئيسية","items":["مصنوعة من فولاذ مقاوم للصدأ عالي الجودة ومتين للاستخدام طويل الأمد.","مطلية بالبوليمر لراحة أكبر ولتقليل تهيّج البشرة.","حدّة قصوى لحلاقة دقيقة وآمنة في كل استخدام.","تنزلق بنعومة على البشرة، لمنع الجروح وعدم الراحة.","عبوة من 100 شفرة لتزويد طويل الأمد ولقيمة استثنائية."]},{"t":"عن المنتج","items":["شفرات الحلاقة مزدوجة الحد من L3VEL3™ مصنوعة من الفولاذ المقاوم للصدأ المتين ومطلية بالبوليمر لأقصى راحة. توفّر الشفرات حلاقة ناعمة وآمنة مع تقليل التهيّج والجروح. بحدّة مذهلة وأداء ثابت، هي الخيار الأمثل لكل من يبحث عن حلاقة عالية الجودة ودقيقة. العبوة الكبيرة المكوّنة من 100 شفرة تضمن استخداماً طويلاً وراحة بال."]}]}},"מחזיק תער — אדום":{"he":{"tag":"פלדת אל-חלד | 3 מסמרים | 6 צבעים","sections":[{"t":"על המוצר","items":["תכונות עיקריות: עיצוב חכם לגילוח בטוח, מדויק ותוצאות מושלמות. גוף עשוי מפלדת אל-חלד אנודייז לעמידות וסגנון יוקרתי. ידית מפלסטיק קשיח עם שלושה מסמרים לחוזק ואורך חיים. דק וקל משקל, לנוחות ושליטה מקסימלית. זמין במבחר צבעים מרהיבים להתאמה אישית ולבידול.","למה זה מוצר פורץ דרך? מחזיק סכין גילוח ישר נועד לשפר את השליטה והדיוק בכל גילוח. בין אם אתם מגלחים זקן, מעצבים את הפנים או יוצרים אומנות שיער, הכלי הזה יבטיח תוצאות מקצועיות. גוף פלדת האל-חלד הדק מאפשר גילוח קרוב ובטוח תוך שמירה על עמידות לאורך זמן. החלפת הלהב קלה ומהירה, כך שתוכלו להתמקד בעבודה ולספק שירות ללא פשרות. הידית הארגונומית עשויה מפלסטיק קשיח המבטיח אחיזה יציבה ונוחה, גם בעבודה על פרטים קטנים ומורכבים. שלושת המסמרים הממוקמים בצורה מדויקת מחזקים את הידית ומאריכים את חיי המוצר. בזכות העיצוב והביצועים המרשימים, מחזיק סכין גילוח ישר הוא הבחירה המושלמת לכל ספר או מעצב שיער."]}]},"ar":{"tag":"الفولاذ المقاوم للصدأ | 3 مسامير | 6 ألوان","sections":[{"t":"عن المنتج","items":["الميزات الرئيسية: تصميم ذكي لحلاقة آمنة ودقيقة ولنتائج مثالية. جسم مصنوع من الفولاذ المقاوم للصدأ المؤكسد للمتانة ولأسلوب فاخر. مقبض من البلاستيك الصلب مع ثلاثة مسامير للقوة ولطول العمر. رفيع وخفيف الوزن، للراحة وللتحكّم الأقصى. متوفر بتشكيلة ألوان مبهرة للتخصيص وللتميّز.","لماذا هذا المنتج نقلة نوعية؟ صُمّم حامل شفرة الحلاقة المستقيم لتحسين التحكّم والدقة في كل حلاقة. سواء كنتم تحلقون اللحية أو تحدّدون ملامح الوجه أو ترسمون فن الشعر، ستضمن لكم هذه الأداة نتائج احترافية. جسم الفولاذ المقاوم للصدأ الرفيع يتيح حلاقة قريبة وآمنة مع الحفاظ على المتانة مع الوقت. تبديل الشفرة سهل وسريع، بحيث تركّزون على العمل وتقدّمون خدمة بلا تنازلات. المقبض المريح للاستخدام مصنوع من بلاستيك صلب يضمن قبضة ثابتة ومريحة، حتى عند العمل على تفاصيل صغيرة ومعقّدة. المسامير الثلاثة الموضوعة بدقة تقوّي المقبض وتطيل عمر المنتج. بفضل التصميم والأداء المميّزين، حامل شفرة الحلاقة المستقيم هو الخيار الأمثل لكل حلاق أو مصفف شعر."]}]}},"מחזיק תער — ירוק":{"he":{"tag":"פלדת אל-חלד | 3 מסמרים | 6 צבעים","sections":[{"t":"איך להשתמש","items":["פתחו את הידית המתקפלת.","הכניסו להב גילוח ישר למחזיק.","התחילו בעבודה – לגילוח שיער פנים או לעיצוב אומנות שיער.","מומלץ לשלב עם…","להשגת גילוח קרוב ונוח במיוחד ללא גירויים, השתמשו ב ג’ל הגילוח השקוף שלנו . הנוסחה הברורה מאפשרת לראות בדיוק היכן עברה הלהב ומה נשאר לגלח. בסיום, הסירו שיער רפוי בעזרת מברשת הרכות המקצועית שלנו – כי הפרטים הקטנים הם אלה שמביאים לקוחות חוזרים."]},{"t":"תכונות עיקריות","items":["עיצוב חכם לגילוח בטוח, מדויק ותוצאות מושלמות.","גוף עשוי מפלדת אל-חלד אנודייז לעמידות וסגנון יוקרתי.","ידית מפלסטיק קשיח עם שלושה מסמרים לחוזק ואורך חיים.","דק וקל משקל, לנוחות ושליטה מקסימלית.","זמין במבחר צבעים מרהיבים להתאמה אישית ולבידול."]},{"t":"על המוצר","items":["שדרגו את שגרת הגילוח שלכם עם מחזיק סכין גילוח ישר המשלב בין עיצוב חכם, שליטה מושלמת וסטייל בולט. מחזיק הסכין שלנו מספק אחיזה משופרת לתוצאות מדויקות וגימור מושלם. גוף הפלדה האל-חלד הדקיק והעמיד מאפשר גילוח קרוב ונוח, בעוד הידית מפלסטיק קשיח מבטיחה אחיזה יציבה ואורך חיים ארוך יותר. עם מבחר צבעים מרהיבים, המוצר הזה לא רק ישפר את הביצועים שלכם אלא גם ישדר את הסטייל האישי שלכם."]}]},"ar":{"tag":"الفولاذ المقاوم للصدأ | 3 مسامير | 6 ألوان","sections":[{"t":"طريقة الاستخدام","items":["افتحوا المقبض القابل للطي.","أدخلوا شفرة حلاقة مستقيمة في الحامل.","ابدأوا العمل – لحلاقة شعر الوجه أو لتنفيذ فن الشعر.","يُنصح بدمجه مع…","للحصول على حلاقة قريبة ومريحة للغاية دون تهيّج، استخدموا جل الحلاقة الشفاف لدينا. التركيبة الشفافة تتيح رؤية أين مرّت الشفرة بالضبط وما تبقّى للحلاقة. في النهاية، أزيلوا الشعر المتساقط بواسطة فرشاة النعومة الاحترافية لدينا – لأن التفاصيل الصغيرة هي ما تجلب الزبائن المتكررين."]},{"t":"الميزات الرئيسية","items":["تصميم ذكي لحلاقة آمنة ودقيقة ولنتائج مثالية.","جسم مصنوع من الفولاذ المقاوم للصدأ المؤكسد للمتانة ولأسلوب فاخر.","مقبض من البلاستيك الصلب مع ثلاثة مسامير للقوة ولطول العمر.","رفيع وخفيف الوزن، للراحة وللتحكّم الأقصى.","متوفر بتشكيلة ألوان مبهرة للتخصيص وللتميّز."]},{"t":"عن المنتج","items":["طوّروا روتين الحلاقة لديكم مع حامل شفرة حلاقة مستقيم يجمع بين تصميم ذكي وتحكّم مثالي وستايل لافت. يوفّر حامل الشفرة لدينا قبضة محسّنة لنتائج دقيقة ومظهر نهائي مثالي. جسم الفولاذ المقاوم للصدأ الرفيع والمتين يتيح حلاقة قريبة ومريحة، بينما يضمن ال  مع ثلاثة مسامير للقوة ولطول العمر.","رفيع وخفيف الوزن، للراحة وللتحكّم الأقصى.","متوفر بتشكيلة ألوان مبهرة للتخصيص وللتميّز."]},{"t":"عن المنتج","items":["طوّروا روتين الحلاقة لديكم مع حامل شفرة حلاقة مستقيم يجمع بين تصميم ذكي وتحكّم مثالي وستايل لافت. يوفّر حامل الشفرة لدينا قبضة محسّنة لنتائج دقيقة ومظهر نهائي مثالي. جسم الفولاذ المقاوم للصدأ الرفيع والمتين يتيح حلاقة قريبة ومريحة، بينما يضمن المقبض من البلاستيك الصلب قبضة ثابتة وعمراً أطول. مع تشكيلة ألوان مبهرة، هذا المنتج لن يحسّن أداءكم فحسب بل سيعكس أيضاً ستايلكم الشخصي."]}]}},"תער גילוח טורקי":{"he":{"tag":"עיצוב אלגנטי | אחיזה מאוזנת | שחור/לבן/אדום","sections":[{"t":"על המוצר","items":["חווה את הגילוח המושלם עם תער הגילוח הטורקי המעוצב – הבחירה המושלמת למי שמחפש מראה חד ונקי בשילוב יוקרה ונוחות.","עם ידית מעוצבת בקפידה ואיזון מושלם בין להב לידית, התער הזה מספק גילוח קרוב, מדויק ונעים בכל שימוש. בין אם אתה ספר מקצועי או פשוט אוהב להיראות מטופח – תער הגילוח הזה ייתן לך שליטה מלאה ותחושת פרימיום בכל תנועה."]}]},"ar":{"tag":"تصميم أنيق | قبضة متوازنة | أسود/أبيض/أحمر","sections":[{"t":"عن المنتج","items":["اختبر الحلاقة المثالية مع موس الحلاقة التركي المصمّم بعناية – الخيار الأمثل لمن يبحث عن مظهر حاد ونظيف مع الفخامة والراحة.","بمقبض مصمّم بعناية وتوازن مثالي بين الشفرة والمقبض، يمنح هذا الموس حلاقة قريبة ودقيقة ومريحة في كل استخدام. سواء كنت حلاقاً احترافياً أو تحب ببساطة أن تبدو أنيقاً – سيمنحك هذا الموس تحكماً كاملاً وإحساساً فاخراً في كل حركة."]}]}},"מחזיק תער — כחול":{"he":{"tag":"פלדת אל-חלד | 3 מסמרים","sections":[{"t":"איך להשתמש","items":["פתחו את הידית המתקפלת.","הכניסו להב גילוח ישר למחזיק.","התחילו בעבודה – לגילוח שיער פנים או לעיצוב אומנות שיער.","מומלץ לשלב עם…","להשגת גילוח קרוב ונוח במיוחד ללא גירויים, השתמשו ב ג’ל הגילוח השקוף שלנו . הנוסחה הברורה מאפשרת לראות בדיוק היכן עברה הלהב ומה נשאר לגלח. בסיום, הסירו שיער רפוי בעזרת מברשת הרכות המקצועית שלנו – כי הפרטים הקטנים הם אלה שמביאים לקוחות חוזרים."]},{"t":"תכונות עיקריות","items":["עיצוב חכם לגילוח בטוח, מדויק ותוצאות מושלמות.","גוף עשוי מפל חיים ארוך יותר. עם מבחר צבעים מרהיבים, המוצר הזה לא רק ישפר את הביצועים שלכם אלא גם ישדר את הסטייל האישי שלכם."]}]},"ar":{"tag":"الفولاذ المقاوم للصدأ | 3 مسامير","sections":[{"t":"طريقة الاستخدام","items":["افتحوا المقبض القابل للطي.","أدخلوا شفرة حلاقة مستقيمة في الحامل.","ابدأوا العمل – لحلاقة شعر الوجه أو لتنفيذ فن الشعر.","يُنصح بدمجه مع…","للحصول على حلاقة قريبة ومريحة للغاية دون تهيّج، استخدموا جل الحلاقة الشفاف لدينا. التركيبة الشفافة تتيح رؤية أين مرّت الشفرة بالضبط وما تبقّى للحلاقة. في النهاية، أزيلوا الشعر المتساقط بواسطة فرشاة النعومة الاحترافية لدينا – لأن التفاصيل الصغيرة هي ما تجلب الزبائن المتكررين."]},{"t":"الميزات الرئيسية","items":["تصميم ذكي لحلاقة آمنة ودقيقة ولنتائج مثالية.","جسم مصنوع من الفولاذ المقاوم للصدأ المؤكسد للمتانة ولأسلوب فاخر.","مقبض من البلاستيك الصلب مع ثلاثة مسامير للقوة ولطول العمر.","رفيع وخفيف الوزن، للراحة وللتحكّم الأقصى.","متوفر بتشكيلة ألوان مبهرة للتخصيص وللتميّز."]},{"t":"عن المنتج","items":["طوّروا روتين الحلاقة لديكم مع حامل شفرة حلاقة مستقيم يجمع بين تصميم ذكي وتحكّم مثالي وستايل لافت. يوفّر حامل الشفرة لدينا قبضة محسّنة لنتائج دقيقة ومظهر نهائي مثالي. جسم الفولاذ المقاوم للصدأ الرفيع والمتين يتيح حلاقة قريبة ومريحة، بينما يضمن المقبض من البلاستيك الصلب قبضة ثابتة وعمراً أطول. مع تشكيلة ألوان مبهرة، هذا المنتج لن يحسّن أداءكم فحسب بل سيعكس أيضاً ستايلكم الشخصي."]}]}},"תער גילוח טורקי — לבן":{"he":{"tag":"עיצוב אלגנטי | אחיזה מאוזנת","sections":[{"t":"על המוצר","items":["חווה את הגילוח המושלם עם תער הגילוח הטורקי המעוצב – הבחירה המושלמת למי שמחפש מראה חד ונקי בשילוב יוקרה ונוחות.","עם ידית מעוצבת בקפידה ואיזון מושלם בין להב לידית, התער הזה מספק גילוח קרוב, מדויק ונעים בכל שימוש. בין אם אתה ספר מקצועי או פשוט אוהב להיראות מטופח – תער הגילוח הזה ייתן לך שליטה מלאה ותחושת פרימיום בכל תנועה."]}]},"ar":{"tag":"تصميم أنيق | قبضة متوازنة","sections":[{"t":"عن المنتج","items":["اختبر الحلاقة المثالية مع موس الحلاقة التركي المصمّم بعناية – الخيار الأمثل لمن يبحث عن مظهر حاد ونظيف مع الفخامة والراحة.","بمقبض مصمّم بعناية وتوازن مثالي بين الشفرة والمقبض، يمنح هذا الموس حلاقة قريبة ودقيقة ومريحة في كل استخدام. سواء كنت حلاقاً احترافياً أو تحب ببساطة أن تبدو أنيقاً – سيمنحك هذا الموس تحكماً كاملاً وإحساساً فاخراً في كل حركة."]}]}},"תער גילוח טורקי — אדום":{"he":{"tag":"עיצוב אלגנטי | אחיזה מאוזנת","sections":[{"t":"על המוצר","items":["חווה את הגילוח המושלם עם תער הגילוח הטורקי המעוצב – הבחירה המושלמת למי שמחפש מראה חד ונקי בשילוב יוקרה ונוחות.","עם ידית מעוצבת בקפידה ואיזון מושלם בין להב לידית, התער הזה מספק גילוח קרוב, מדויק ונעים בכל שימוש. בין אם אתה ספר מקצועי או פשוט אוהב להיראות מטופח – תער הגילוח הזה ייתן לך שליטה מלאה ותחושת פרימיום בכל תנועה."]}]},"ar":{"tag":"تصميم أنيق | قبضة متوازنة","sections":[{"t":"عن المنتج","items":["اختبر الحلاقة المثالية مع موس الحلاقة التركي المصمّم بعناية – الخيار الأمثل لمن يبحث عن مظهر حاد ونظيف مع الفخامة والراحة.","بمقبض مصمّم بعناية وتوازن مثالي بين الشفرة والمقبض، يمنح هذا الموس حلاقة قريبة ودقيقة ومريحة في كل استخدام. سواء كنت حلاقاً احترافياً أو تحب ببساطة أن تبدو أنيقاً – سيمنحك هذا الموس تحكماً كاملاً وإحساساً فاخراً في كل حركة."]}]}},"מגבת גילוח פרימיום שחורה":{"he":{"tag":"100% כותנה | 71×35 ס\"מ | עמידה לכימיקלים","sections":[{"t":"תכונות עיקריות","items":["עשויה מ־100% כותנה איכותית לרכות וספיגה מעולות","עמידה בפני אקונומיקה, צבעים, חומרים כימיים וכתמים","גימור מקצועי בקצוות לנוחות מרבית ועמידות לאורך זמן","בצבע שחור עם לוגו לבן מרשים – מראה יוקרתי ומקצועי","מושלמת לגילוחים, תספורות, טיפולי פנים ועוד"]},{"t":"על המוצר","items":["הצטייד במלאי של המגבות הרכות והיוקרתיות שלנו – עמידות לאקונומיקה, כימיקלים וכתמים.","מגבות הן אחד הפריטים החשובים והשימושיים ביותר במספרה. הן סופגות מים, מגנות על בגדי הלקוח ומשדרות מראה מקצועי. אבל לא כל מגבת מתאימה – דרושה איכות גבוהה, רכות ונראות מושלמת. המגבת המקצועית שלנו עונה על כל הדרישות – ובמחיר משתלם."]},{"t":"למה זו מגבת משנה משחק","items":["המגבת הצנועה של הספר היא כלי עבודה קריטי. כשהיא עשויה מבד איכותי – היא מחזיקה לאורך זמן, סופגת היטב ונראית מצוין גם לאחר כביסות רבות. מגבות מוכתמות משדרות רשלנות – וזה ממש לא המסר שאתה רוצה להעביר ללקוח.","המגבת שלנו מציעה את כל היתרונות: בד כותנה פרימיום, תחושת רכות עילאית, קצוות מעובדים ברמה גבוהה ונראות מקצועית. היא מתמודדת בקלות עם צבעים עזים וחומרים כימיים – ונשארת עמידה ונקייה. והמחיר? משתלם במיוחד.","זו מגבת שאתה יכול להסתמך עליה בכל שימוש – רכה, סופגת, נראית מדהים – והיא תעלה את רמת השירות שאתה מעניק. מגיעה בגודל נוח שמתאים לכל שימוש במספרה או בסלון יופי.","מידות: 71 ס\"מ אורך × 35 ס\"מ רוחב","כביסה: במכונה עם צבעים דומים"]}]},"ar":{"tag":"100% قطن | 71×35 سم | تقاوم المواد الكيميائية","sections":[{"t":"الميزات الرئيسية","items":["مصنوعة من 100% قطن عالي الجودة لنعومة وامتصاص ممتازين","تقاوم الكلور والصبغات والمواد الكيميائية والبقع","تشطيب احترافي للأطراف لراحة قصوى ومتانة طويلة الأمد","بلون أسود مع شعار أبيض لافت – مظهر فاخر واحترافي","مثالية للحلاقة وقص الشعر والعناية بالبشرة وغيرها"]},{"t":"عن المنتج","items":["زوّد مخزونك بمناشفنا الناعمة الفاخرة – تقاوم الكلور والمواد الكيميائية والبقع.","المناشف من أهم الأدوات وأكثرها استخدامًا في صالون الحلاقة. تمتص الماء، وتحمي ملابس الزبون، وتعكس مظهرًا احترافيًا. لكن ليست كل منشفة مناسبة – المطلوب جودة عالية ونعومة ومظهر مثالي. منشفتنا الاحترافية تلبي كل هذه المتطلبات – وبسعر مجزٍ."]},{"t":"لماذا تغيّر هذه المنشفة القواعد","items":["منشفة الحلاق المتواضعة أداة عمل حاسمة. وحين تكون من قماش عالي الجودة – تدوم طويلًا، وتمتص جيدًا، وتبدو ممتازة حتى بعد غسلات كثيرة. المناشف الملطخة توحي بالإهمال – وهذه ليست الرسالة التي تريد إيصالها للزبون.","منشفتنا تقدّم كل المزايا: قماش قطن بريميوم، وإحساس نعومة فائق، وأطراف معالجة بمستوى عالٍ، ومظهر احترافي. تتعامل بسهولة مع الصبغات القوية والمواد الكيميائية – وتبقى متينة ونظيفة. والسعر؟ مجزٍ جدًا.","منشفة يمكنك الاعتماد عليها في كل استخدام – ناعمة، ماصة، تبدو رائعة – وسترفع مستوى الخدمة التي تقدمها. تأتي بمقاس مريح يناسب كل استخدام في صالون الحلاقة أو صالون التجميل.","الأبعاد: 71 سم طول × 35 سم عرض","الغسيل: في الغسالة مع ألوان مشابهة"]}]}},"מגבות פנים לבנות — סט 3":{"he":{"tag":"100% כותנה | 68.5×34.3 ס\"מ","sections":[{"t":"תכונות עיקריות","items":["• עשויות מ־100% כותנה פרימיום לרכות מפנקת","• שומרות על מראה לבן וספיגה מקסימלית גם לאחר כביסות רבות","• קצוות תפורים בגימור מקצועי – לנוחות ועמידות","• מגיעות בשלישייה – תמורה גבוהה במחיר משתלם","• מתאימות לגילוחים חמים, תספורות, ייבוש שיער ושימוש כללי"]},{"t":"על המוצר","items":["שדרג את חוויית הגילוח והטיפוח עם מגבות ברבר יוקרתיות – מושלמות לתספורות וגילוח חם.","בין אם במספרה או בבית, מגבות הן פריט הכרחי לשימוש יומיומי. הן שימושיות למשימות קטנות, ויכולות להפוך גילוח או טיפול פנים לחוויה מפנקת. אבל אל תתפשר על בד פשוט – בשביל נוחות ויעילות, אתה צריך חומר פרימיום שגם מבצע. מגבות הפנים הלבנות שלנו נותנות לך בדיוק את זה – 100% כותנה איכותית לרכות מקסימלית ויכולת ספיגה מעולה. הן עמידות לאורך זמן ולא מאכזבות – גם אחרי אינספור כביסות. ייבוש שיער, טיפוח עור או גילוח חם – הכול עולה רמה."]},{"t":"כולל","items":["• 3 מגבות פנים","• עשויות 100% כותנה","• מידות: אורך 27 אינץ' (כ־68.5 ס\"מ) | רוחב 13.5 אינץ' (כ־34.3 ס\"מ)"]}]},"ar":{"tag":"100% قطن | 68.5×34.3 سم","sections":[{"t":"الميزات الرئيسية","items":["• مصنوعة من 100% قطن فاخر لنعومة مدلّلة","• تحافظ على بياضها وامتصاصها الأقصى حتى بعد غسلات كثيرة","• أطراف مخيطة بمظهر نهائي احترافي – للراحة والمتانة","• تأتي في مجموعة من ثلاث – قيمة عالية بسعر مجزٍ","• تناسب الحلاقة الساخنة وقصات الشعر وتجفيف الشعر والاستخدام العام"]},{"t":"عن المنتج","items":["ارتقِ بتجربة الحلاقة والعناية مع مناشف حلاق فاخرة – مثالية لقصات الشعر والحلاقة الساخنة.","سواء في صالون الحلاقة أو في البيت، المناشف عنصر لا غنى عنه للاستخدام اليومي. هي مفيدة للمهام الصغيرة، وتحوّل الحلاقة أو العناية بالبشرة إلى تجربة مدلّلة. لكن لا ترضَ بقماش عادي – للراحة والفعالية تحتاج خامة فاخرة تؤدي عملها. مناشف الوجه البيضاء لدينا تمنحك ذلك تمامًا – 100% قطن عالي الجودة لنعومة قصوى وامتصاص ممتاز. تدوم طويلًا ولا تخذلك – حتى بعد غسلات لا تُحصى. تجفيف الشعر، العناية بالبشرة أو الحلاقة الساخنة – كل شيء يرتقي مستوى."]},{"t":"يتضمن","items":["• 3 مناشف وجه","• مصنوعة من 100% قطن","• المقاسات: الطول 27 إنش (نحو 68.5 سم) | العرض 13.5 إنش (نحو 34.3 سم)"]}]}},"דיספנסר מיכל חיטוי":{"he":{"tag":"אקריל | נירוסטה | 1.1 ליטר","sections":[{"t":"תכונות עיקריות","items":["• מבנה אקרילי עמיד – חזק אך קל משקל, מפחית סיכון לשבר","• מכסה וסלסילה מנירוסטה – בנויים לעמידות עם גימור מבריק ויוקרתי","• בסיס גומי מונע החלקה – יציבות מירבית על משטחים ומניעת נזילות","• קל לשימוש – ממלאים בחומר חיטוי ומכניסים את הכלים","• גודל אידיאלי – מתאים למגוון כלים לא חשמליים כמו מסרקים, מספריים ומברשות"]},{"t":"על המוצר","items":["שמור על היגיינה ברמה הגבוהה ביותר במספרה שלך עם צנצנת החיטוי האקרילית של L3VEL3, המיועדת לחיטוי מהיר ויעיל של כלי עבודה. צנצנת חזקה זו עשויה אקריל עמיד, מה שהופך אותה לשילוב אידיאלי של סטייל ופונקציונליות. עם מכסה וסלסילה מנירוסטה ובסיס גומי מונע החלקה – היא מבטיחה חיטוי בטוח, מקצועי ונוח. מושלמת לחיטוי מסרקים, מספריים, ראשים של מכונות תספורת ועוד – כלי חובה לכל ספר או מעצב שיער מקצועי."]},{"t":"מפרט טכני","items":["• גובה: 11.5 אינץ' (כ-29 ס\"מ)","• קוטר בסיס: 4.25 אינץ' (כ-10.8 ס\"מ)","• קיבולת: 37 אונקיות נוזל (כ-1.1 ליטר)"]}]},"ar":{"tag":"أكريليك | فولاذ مقاوم للصدأ | 1.1 لتر","sections":[{"t":"الميزات الرئيسية","items":["• بنية أكريليك متينة – قوية لكنها خفيفة، تقلل خطر الكسر","• غطاء وسلة من الفولاذ المقاوم للصدأ – مبنيان للمتانة بمظهر نهائي لامع وفاخر","• قاعدة مطاطية مانعة للانزلاق – ثبات أقصى على الأسطح ومنع للتسرب","• سهلة الاستخدام – املأها بمادة التعقيم وأدخل الأدوات","• حجم مثالي – يناسب أدوات غير كهربائية متنوعة كالأمشاط والمقصات والفُرَش"]},{"t":"عن المنتج","items":["حافظ على أعلى مستوى من النظافة في صالونك مع علبة التعقيم الأكريليك من L3VEL3، المصممة لتعقيم أدوات العمل بسرعة وفعالية. هذه العلبة القوية مصنوعة من أكريليك متين، ما يجعلها مزيجًا مثاليًا من الأناقة والعملية. مع غطاء وسلة من الفولاذ المقاوم للصدأ وقاعدة مطاطية مانعة للانزلاق – تضمن تعقيمًا آمنًا واحترافيًا ومريحًا. مثالية لتعقيم الأمشاط والمقصات ورؤوس ماكينات القص وغيرها – أداة لا غنى عنها لكل حلاق أو مصفف شعر احترافي."]},{"t":"المواصفات الفنية","items":["• الارتفاع: 11.5 إنش (نحو 29 سم)","• قطر القاعدة: 4.25 إنش (نحو 10.8 سم)","• السعة: 37 أونصة سائلة (نحو 1.1 لتر)"]}]}},"פויל פופ אפ — 500 דפים":{"he":{"tag":"12.7×27.9 ס\"מ | אלומיניום איכותי","sections":[{"t":"על המוצר","items":["שדרג את חוויית העבודה במספרה עם פויל הפופ אפ המקצועי של L3VEL3 – נייר אלומיניום איכותי לצביעת שיער, גוונים וטכניקות מתקדמות.","החבילה כוללת 500 דפים חתוכים מראש בגודל 12.7×27.9 ס\"מ, נשלפים בקלות ובמהירות – לחיסכון בזמן ודיוק מקסימלי."]}]},"ar":{"tag":"12.7×27.9 سم | ألمنيوم عالي الجودة","sections":[{"t":"عن المنتج","items":["ارتقِ بتجربة العمل في صالون الحلاقة مع فويل بوب أب الاحترافي من L3VEL3 – ورق ألمنيوم عالي الجودة لصبغ الشعر والدرجات اللونية والتقنيات المتقدمة.","العبوة تضم 500 ورقة مقصوصة مسبقًا بمقاس 12.7×27.9 سم، تُسحب بسهولة وسرعة – لتوفير الوقت ودقة قصوى."]}]}},"אפליקטור סיבי שיער":{"he":{"tag":"פיית שפריצר מסתובבת | צנצנת זכוכית","sections":[{"t":"איך להשתמש","items":["הסירו את המכסה, הכניסו את סיבי השיער לצנצנת הזכוכית, וסגרו את המכסה","כוונו את הפייה לאזורים המבוקשים","לחצו על הנורה הגמישה כדי לרסס את הסיבים ישירות על השיער","עובד נהדר עם מלאו את האפליקטור שלנו בסיבי שיער L3VEL3 לקבלת החבילה המלאה. האבקה המפולגת יוצרת את המראה של שיער עבה ומסתירה אזורים דלילים. כדי לסדר את קו השיער וליצור את הגימור הטבעי ביותר, השתמשו במסרק אפליקטור סיבי שיער שלנו."]},{"t":"תכונות עיקריות","items":["פיית שפריצר צרה לאספקת אבקה ממוקדת עם שליטה אופטימלית","פיית השפריצר מסתובבת ליישום מדויק מכל זווית","נורה גמישה קלה לשימוש וכיסוי מכסה עשוי נירוסטה עמיד","צנצנת זכוכית ברורה מאפשרת לכם לדעת מתי הגיע הזמן למילוי מחדש","קל לשימוש ולחיטוי, מצמצם בלגן ומפחית בזבוז חומר"]},{"t":"על המוצר","items":["יותר שליטה, פחות בלגן. שפריצר סיבי השיער שלנו הוא הדרך החכמה להשגת כיסוי מושלם.","פיזור אבקת סיבי שיער היה כבר אתמול. אם אתם דואגים להשגת תוצאות מושלמות, אתם זקוקים לשיטה מקצועית יותר. איך נשמע לכם כלי שמספק יותר שליטה על יישום האבקה, אופטימיזציה של התהליך, ומייצר הרבה פחות בלגן? האפליקטור שלנו לסיבי שיער עושה בדיוק את זה ועוד. הוא כולל אטומיזר מעוצב במיוחד שמסייע לכם לכוון לאזורים מדויקים על הקרקפת. הנורה הגמישה קלה ללחיצה, והצנצנת זכוכית מראה לכם כמה חומר נשאר. חכם במיוחד."]}]},"ar":{"tag":"فوهة بخاخ دوّارة | علبة زجاجية","sections":[{"t":"طريقة الاستخدام","items":["أزيلوا الغطاء، ضعوا ألياف الشعر في العلبة الزجاجية، وأغلقوا الغطاء","وجّهوا الفوهة نحو المناطق المطلوبة","اضغطوا على البصلة المرنة لرش الألياف مباشرة على الشعر","يعمل بشكل رائع مع املأوا أداة التطبيق لدينا بألياف الشعر L3VEL3 للحصول على الحزمة الكاملة. البودرة الموزّعة تصنع مظهر شعر كثيف وتخفي المناطق الخفيفة. ولترتيب خط الشعر والحصول على مظهر نهائي طبيعي تمامًا، استخدموا مشط أداة تطبيق ألياف الشعر لدينا."]},{"t":"الميزات الرئيسية","items":["فوهة بخاخ ضيقة لتوصيل بودرة مركّزة مع تحكم مثالي","فوهة البخاخ دوّارة لتطبيق دقيق من كل زاوية","بصلة مرنة سهلة الاستخدام وغطاء من الفولاذ المقاوم للصدأ المتين","علبة زجاجية شفافة تتيح لكم معرفة موعد إعادة التعبئة","سهلة الاستخدام والتعقيم، تقلل الفوضى وتحدّ من هدر المادة"]},{"t":"عن المنتج","items":["تحكم أكثر، فوضى أقل. بخاخ ألياف الشعر لدينا هو الطريقة الذكية للوصول إلى تغطية مثالية.","نثر بودرة ألياف الشعر باليد أصبح من الماضي. إن كنتم تهتمون بالوصول إلى نتائج مثالية، فأنتم بحاجة إلى أسلوب أكثر احترافية. ما رأيكم بأداة تمنح تحكمًا أكبر بتطبيق البودرة، وتحسّن العملية، وتُحدث فوضى أقل بكثير؟ أداة تطبيق ألياف الشعر لدينا تفعل ذلك بالضبط وأكثر. تضم بخاخًا مصمّمًا خصيصًا يساعدكم على التوجيه إلى مناطق دقيقة في فروة الرأس. البصلة المرنة سهلة الضغط، والعلبة الزجاجية تُظهر لكم كمية المادة المتبقية. ذكية جدًا."]}]}},"נייר צוואר כתום":{"he":{"tag":"דבק עצמי | גמיש ועדין","sections":[{"t":"איך להשתמש","items":["קרעו רצועת כיסוי באורך מתאים לצוואר הלקוח.","מתחו בעדינות את הכיסוי בעת ההנחה, כך שיתאים לצוואר.","הדביקו את הכיסוי סביב הצוואר בצורה בטוחה.","מומלץ לשלב עם…","להשלמת ההגנה, השתמשו בכיסוי צוואר יחד עם חלוק התספורת המקצועי שלנו , המציע עמידות גבוהה בפני מים, צבעי שיער וכימיקלים נוספים."]},{"t":"תכונות עיקריות","items":["מגן על הצוואר מפני שיער, זיעה, צבעים וחיידקים.","דבק עצמי לנוחות שימוש ונצמד לעור בצורה בטוחה.","מתאים לכל גודל צוואר בזכות גמישות ונוחות מקסימלית.","עשוי מחומרים לא רעילים, רך על העור וחד-פעמי לשמירה על היגיינה.","קל לשימוש, חד-פעמי ונוח ליישום מהיר."]},{"t":"על המוצר","items":["כיסוי צוואר הוא הפתרון המושלם לשמירה על היגיינה ונוחות במהלך תספורת. המוצר נועד למנוע מגע של שיער, נוזלים, וזיהומים עם עור הלקוח, ולהבטיח חוויה נקייה ונעימה לכל לקוח. כיסוי הצוואר מציע שכבת הגנה נוספת, ומעניק שקט נפשי הן ללקוח והן לספר."]}]},"ar":{"tag":"لاصق ذاتي | مرن ولطيف","sections":[{"t":"طريقة الاستخدام","items":["مزّقوا شريط غطاء بطول مناسب لرقبة الزبون.","شدّوا الغطاء بلطف عند وضعه، كي يلائم الرقبة.","ألصقوا الغطاء حول الرقبة بإحكام.","يُنصح بدمجه مع…","لاستكمال الحماية، استخدموا غطاء الرقبة مع رداء القص الاحترافي لدينا ، الذي يوفر مقاومة عالية للماء وصبغات الشعر والمواد الكيميائية الأخرى."]},{"t":"الميزات الرئيسية","items":["يحمي الرقبة من الشعر والعرق والصبغات والجراثيم.","لاصق ذاتي لسهولة الاستخدام ويلتصق بالبشرة بأمان.","يناسب كل مقاسات الرقبة بفضل مرونته وراحته القصوى.","مصنوع من مواد غير سامة، لطيف على البشرة وللاستعمال مرة واحدة حفاظًا على النظافة.","سهل الاستخدام، للاستعمال مرة واحدة ومريح للتطبيق السريع."]},{"t":"عن المنتج","items":["غطاء الرقبة هو الحل المثالي للحفاظ على النظافة والراحة أثناء القص. صُمّم المنتج لمنع ملامسة الشعر والسوائل والملوثات لبشرة الزبون، ولضمان تجربة نظيفة ولطيفة لكل زبون. يوفر غطاء الرقبة طبقة حماية إضافية، ويمنح راحة البال للزبون وللحلاق معًا."]}]}},"נייר צוואר שחור":{"he":{"tag":"דבק עצמי | גמיש ועדין","sections":[{"t":"איך להשתמש","items":["קרעו רצועת כיסוי באורך מתאים לצוואר הלקוח.","מתחו בעדינות את הכיסוי בעת ההנחה, כך שיתאים לצוואר.","הדביקו את הכיסוי סביב הצוואר בצורה בטוחה.","מומלץ לשלב עם…","להשלמת ההגנה, השתמשו בכיסוי צוואר יחד עם חלוק התספורת המקצועי שלנו , המציע עמידות גבוהה בפני מים, צבעי שיער וכימיקלים נוספים."]},{"t":"תכונות עיקריות","items":["מגן על הצוואר מפני שיער, זיעה, צבעים וחיידקים.","דבק עצמי לנוחות שימוש ונצמד לעור בצורה בטוחה.","מתאים לכל גודל צוואר בזכות גמישות ונוחות מקסימלית.","עשוי מחומרים לא רעילים, רך על העור וחד-פעמי לשמירה על היגיינה.","קל לשימוש, חד-פעמי ונוח ליישום מהיר."]},{"t":"על המוצר","items":["כיסוי צווא זלים, וזיהומים עם עור הלקוח, ולהבטיח חוויה נקייה ונעימה לכל לקוח. כיסוי הצוואר מציע שכבת הגנה נוספת, ומעניק שקט נפשי הן ללקוח והן לספר."]}]},"ar":{"tag":"لاصق ذاتي | مرن ولطيف","sections":[{"t":"طريقة الاستخدام","items":["مزّقوا شريط غطاء بطول مناسب لرقبة الزبون.","شدّوا الغطاء بلطف عند وضعه، كي يلائم الرقبة.","ألصقوا الغطاء حول الرقبة بإحكام.","يُنصح بدمجه مع…","لاستكمال الحماية، استخدموا غطاء الرقبة مع رداء القص الاحترافي لدينا، الذي يوفر مقاومة عالية للماء وصبغات الشعر والمواد الكيميائية الأخرى."]},{"t":"الميزات الرئيسية","items":["يحمي الرقبة من الشعر والعرق والصبغات والجراثيم.","لاصق ذاتي لسهولة الاستخدام ويلتصق بالبشرة بأمان.","يناسب كل مقاسات الرقبة بفضل مرونته وراحته القصوى.","مصنوع من مواد غير سامة، لطيف على البشرة وللاستعمال مرة واحدة حفاظًا على النظافة.","سهل الاستخدام، للاستعمال مرة واحدة ومريح للتطبيق السريع."]},{"t":"عن المنتج","items":["غطاء الرقبة هو الحل المثالي للحفاظ على النظافة والراحة أثناء القص. صُمّم المنتج لمنع ملامسة الشعر والسوائل والملوثات لبشرة الزبون، ولضمان تجربة نظيفة ولطيفة لكل زبون. يوفر غطاء الرقبة طبقة حماية إضافية، ويمنح راحة البال للزبون وللحلاق معًا."]}]}},"מארז מסרקים יוקרתי 9 יח":{"he":{"tag":"פחמן | אנטי-סטטי | נרתיק יוקרתי","sections":[{"t":"איך להשתמש","items":["פתחו את הנרתיק ובחרו את המסרק המתאים לצורך שלכם.","החליקו את המסרק דרך השיער להתרת קשרים, יצירת שבילים או לעיצוב גימור התסרוקת.","לאחר השימוש, נקו וחטאו את המסרקים לשמירה על היגיינה."]},{"t":"תכונות עיקריות","items":["9 מסרקים מקצועיים: במידות 17.8-25.4 ס\"מ ובשיניים במרווחים משתנים לכל צורך עיצובי.","מבנה פחמן פרימיום: קל משקל, עמיד ועמיד לאורך זמן.","ציפוי יוני אנטי-סטטי: מפחית פריזים ומעניק ברק לשיער.","עמידים לחום ולכימיקלים: מושלמים לשימוש עם כלים חמים וטיפולים כימיים.","נרתיק נייד: מגן על המסרקים ומארגן אותם בצורה נוחה ומסודרת."]},{"t":"על המוצר","items":["שדרגו את עיצוב השיער שלכם עם מארז המסרקים המקצועי של L3VEL3, המיועד למעצבים ולספרים שדורשים דיוק ואיכות. הסט כולל 9 מסרקים מקצועיים בגדלים שונים, המתאימים לכל סוג שיער, מרקם וסגנון. כל מסרק עשוי מפחמן עמיד לחום וכימיקלים, מה שהופך אותו למושלם לשימוש יומיומי עם מייבשי שיער, מחליקים או טיפולי צבע. ציפוי יוני מתקדם מבטיח שהשיער יישאר חלק, מבריק וללא חשמל סטטי. בנוסף, הסט מגיע בנרתיק מגן ואלגנטי, נוח לנשיאה ואחסון, אידיאלי למעצבים ניידים."]}]},"ar":{"tag":"كربون | مضاد للكهرباء الساكنة | حقيبة فاخرة","sections":[{"t":"طريقة الاستخدام","items":["افتحوا الحقيبة واختاروا المشط المناسب لحاجتكم.","مرّروا المشط خلال الشعر لفك التشابك أو لرسم الفرقات أو لتشكيل المظهر النهائي للتسريحة.","بعد الاستخدام، نظّفوا وعقّموا الأمشاط للحفاظ على النظافة."]},{"t":"الميزات الرئيسية","items":["9 أمشاط احترافية: بمقاسات 17.8-25.4 سم وبأسنان بمسافات متغيّرة لكل حاجة تصفيف.","بنية كربون فاخرة: خفيفة الوزن، متينة وتدوم طويلاً.","طلاء أيوني مضاد للكهرباء الساكنة: يقلّل التطاير ويمنح الشعر لمعاناً.","مقاومة للحرارة وللمواد الكيميائية: مثالية للاستخدام مع الأدوات الساخنة والعلاجات الكيميائية.","حقيبة محمولة: تحمي الأمشاط وترتّبها بشكل مريح ومنظّم."]},{"t":"عن المنتج","items":["طوّروا تصفيف الشعر لديكم مع عبوة الأمشاط الاحترافية من L3VEL3، المخصّصة للمصففين وللحلاقين الذين يطلبون الدقة والجودة. تضم المجموعة 9 أمشاط احترافية بأحجام مختلفة، تناسب كل نوع شعر وقوام وأسلوب. كل مشط مصنوع من كربون مقاوم للحرارة وللمواد الكيميائية، ما يجعله مثالياً للاستخدام اليومي مع مجففات الشعر أو أجهزة الفرد أو علاجات الصبغة. طلاء أيوني متطور يضمن بقاء الشعر ناعماً ولامعاً وبلا كهرباء ساكنة. كما تأتي المجموعة في حقيبة واقية وأنيقة، سهلة الحمل والتخزين، مثالية للمصففين المتنقلين."]}]}},"מארז מברשות פן עץ — דו":{"he":{"tag":"זיפי ניילון | חבית אלומיניום | ידיות עץ","sections":[{"t":"איך להשתמש","items":["חלקו את השיער למקטעים.","השתמשו במברשת לייבוש ועיצוב השיער תוך כדי פעולת מייבש השיער.","הקפידו לנקות שערות רופפות ולחטא את המברשות לאחר כל שימוש.","מברשות מקצועיות ליצירת תלתלים, גלים, תסרוקות חלקות או נפח מרשים – הבחירה המושלמת לכל מטרה!"]},{"t":"תכונות עיקריות","items":["זיפי ניילון חזקים וגמישים: מחליקים בעדינות על השיער ומשאירים אותו חלק וללא פריזים.","חבית אלומיניום עמידה לחום: מייעלת את זרימת האוויר לייבוש ועיצוב מהירים יותר.","חומר אנטי-סטטי: מבטיח שיער חלק וללא \"שערות סוררות\".","גימור אנטי-בקטריאלי: מתאים במיוחד לשמירה על היגיינה בסלונים מקצועיים.","ידיות עץ דקיקות ואיכותיות: מעוצבות לנוחות אחיזה ושליטה מלאה בזמן השימוש."]},{"t":"מפרט","items":["מידות: 26.7 ס\"מ אורך (מברשת שחור-לבן) ו-21.6 ס\"מ אורך (מברשת שחורה).","כולל: 2 מברשות עץ עגולות."]}]},"ar":{"tag":"شعيرات نايلون | أسطوانة ألمنيوم | مقابض خشب","sections":[{"t":"طريقة الاستخدام","items":["قسّموا الشعر إلى أقسام.","استخدموا الفرشاة لتجفيف الشعر وتصفيفه أثناء عمل مجفف الشعر.","احرصوا على إزالة الشعر المتساقط وتعقيم الفرش بعد كل استخدام.","فرش احترافية لصنع تجعيدات أو موجات أو تسريحات ملساء أو حجم مبهر – الخيار المثالي لكل غرض!"]},{"t":"الميزات الرئيسية","items":["شعيرات نايلون قوية ومرنة: تنزلق بلطف على الشعر وتتركه أملس وبلا تطاير.","أسطوانة ألمنيوم مقاومة للحرارة: تحسّن تدفق الهواء لتجفيف وتصفيف أسرع.","مادة مضادة للكهرباء الساكنة: تضمن شعرًا أملس بلا \"خصلات متمردة\".","طلاء مضاد للبكتيريا: مناسب خصيصًا للحفاظ على النظافة في الصالونات الاحترافية.","مقابض خشبية رفيعة وعالية الجودة: مصممة لراحة الإمساك والتحكم الكامل أثناء الاستخدام."]},{"t":"المواصفات","items":["المقاسات: 26.7 سم طول (الفرشاة السوداء-البيضاء) و21.6 سم طول (الفرشاة السوداء).","يشمل: 2 فرشاة خشبية مستديرة."]}]}},"מארז מסרקי סטיילינג — דו":{"he":{"tag":"שרף עמיד בחום | שיניים רחבות","sections":[{"t":"איך להשתמש","items":["לפני תספורת: השתמשו במסרק על שיער רטוב להסרת קשרים.","בעת ייבוש שיער: חלפו עם המסרק על השיער לקבלת גימור חלק.","לעיצוב תסרוקות: השתמשו במסרק כדי להרים ולעצב את השיער תוך שימוש בספריי עיצוב.","לפיזור מוצרים: בעזרת השיניים הרחבות, חלקו שווה מוצרי טיפוח על פני השיער."]},{"t":"תכונות עיקריות","items":["שני מסרקים לעיצוב שיער והסרת קשרים: מתאימים לבית, סלון או מספרה.","עשויים משרף עמיד: מציעים עמידות גבוהה לחום וחוזק לאורך זמן.","גימור אנטי-סטטי: מבטיח שיער חלק וללא פריזים.","שיניים רחבות: מחליקות בקלות על כל סוגי השיער ומסירות קשרים ללא משיכה.","קצוות מעוגלים: מגנים על הקרקפת מפני גירויים ושריטות."]},{"t":"מפרט","items":["מידות: 17.8 ס\"מ אורך.","כולל: 2 מסרקי עיצוב.","המסרקים המושלמים לכל משימת עיצוב – עמידים, נוחים ומעצבים ללא פשרות!"]}]},"ar":{"tag":"راتنج مقاوم للحرارة | أسنان عريضة","sections":[{"t":"طريقة الاستخدام","items":["قبل القص: استخدموا المشط على شعر مبلل لفك التشابك.","أثناء تجفيف الشعر: مرّروا المشط على الشعر للحصول على مظهر نهائي ناعم.","لتشكيل التسريحات: استخدموا المشط لرفع الشعر وتشكيله مع استعمال سبراي التصفيف.","لتوزيع المنتجات: بواسطة الأسنان العريضة، وزّعوا منتجات العناية بالتساوي على الشعر."]},{"t":"الميزات الرئيسية","items":["مشطان للتصفيف ولفك التشابك: يناسبان المنزل أو الصالون أو صالون الحلاقة.","مصنوعان من راتنج متين: يوفّران مقاومة عالية للحرارة وقوة تدوم طويلاً.","مظهر نهائي مضاد للكهرباء الساكنة: يضمن شعراً ناعماً وبلا تطاير.","أسنان عريضة: تنزلق بسهولة على كل أنواع الشعر وتفك التشابك دون شدّ.","أطراف مدوّرة: تحمي فروة الرأس من التهيّج ومن الخدوش."]},{"t":"المواصفات","items":["المقاسات: 17.8 سم طول.","يتضمن: 2 مشط تصفيف.","الأمشاط المثالية لكل مهمة تصفيف – متينة ومريحة وتصفّف بلا تنازلات!"]}]}},"מסרק סיבים":{"he":{"tag":"לפיזור סיבי שיער אחיד וטבעי","sections":[{"t":"איך להשתמש","items":["מקמו את שיני המסרק בקו השיער של הלקוח.","רססו או פזרו סיבי שיער על האזור הרצוי.","השתמשו במסרק כדי למזג ולפזר את הסיבים באופן שווה.","טיפ מקצועי: השתמשו במסרק עם סיבי שיער L3VEL3 וסיימו עם L3VEL3 Hair Spritz כדי לקבע את הסיבים ולהעניק לשיער מראה עבה ומבריק.","מידות: 3.25 אינץ' אורך x 2.25 אינץ' רוחב"]},{"t":"תכונות עיקריות","items":["כיסוי אחיד: מפזר סיבי שיער באופן שווה למראה דיסקרטי וטבעי.","קווי שיער טבעיים: עיצוב שיניים לא אחיד מדמה קווי שיער אמיתיים, ומונע מראה ישר ולא טבעי.","יישום נקי: הצורה הקמורה שומרת על סיבים מחוץ לפנים ולעיניים.","עמיד לשימוש חוזר: בנייה מפלסטיק הניתן לשטיפה מבטיחה שימוש היגייני וארוך טווח."]},{"t":"על המוצר","items":["מסרק הסיבים L3VEL3 משנה את תהליך יישום סיבי השיער, והופך אותו לפשוט ויעיל עבור ספרים וסטייליסטים. הכלי החדשני הזה מבטיח פיזור אחיד ויוצר קווי שיער טבעיים למראה, תוך כיסוי מושלם של אזורים מתקרחים, קרחות וצמיחת שיער לא אחידה. מיועד לתוצאות מקצועיות, קל לניקוי, חיטוי ושימוש חוזר, ומציע ערך יוצא דופן."]}]},"ar":{"tag":"لتوزيع ألياف الشعر بشكل متجانس وطبيعي","sections":[{"t":"طريقة الاستخدام","items":["ضعوا أسنان المشط عند خط شعر الزبون.","رشّوا أو وزّعوا ألياف الشعر على المنطقة المطلوبة.","استخدموا المشط لدمج الألياف وتوزيعها بالتساوي.","نصيحة احترافية: استخدموا المشط مع ألياف الشعر L3VEL3 وأنهوا مع L3VEL3 Hair Spritz لتثبيت الألياف ومنح الشعر مظهرًا كثيفًا ولامعًا.","المقاسات: 3.25 إنش طول x 2.25 إنش عرض"]},{"t":"الميزات الرئيسية","items":["تغطية متساوية: يوزّع ألياف الشعر بالتساوي لمظهر خفي وطبيعي.","خطوط شعر طبيعية: تصميم أسنان غير منتظم يحاكي خطوط الشعر الحقيقية، ويمنع المظهر المستقيم غير الطبيعي.","تطبيق نظيف: الشكل المنحني يبقي الألياف بعيدًا عن الوجه والعينين.","يدوم لإعادة الاستخدام: تركيبة بلاستيكية قابلة للغسل تضمن استخدامًا صحيًا وطويل الأمد."]},{"t":"عن المنتج","items":["مشط الألياف L3VEL3 يغيّر طريقة تطبيق ألياف الشعر، ويجعلها بسيطة وفعّالة للحلاقين ومصففي الشعر. هذه الأداة المبتكرة تضمن توزيعًا متساويًا وتصنع خطوط شعر تبدو طبيعية، مع تغطية مثالية للمناطق الخفيفة والفراغات والنمو غير المنتظم. مصمم لنتائج احترافية، سهل التنظيف والتعقيم وإعادة الاستخدام، ويقدّم قيمة استثنائية."]}]}},"מארז הייר פיק — דו":{"he":{"tag":"לתלתלים | 2 עיצובים שונים","sections":[{"t":"איך להשתמש","items":["התחילו עם שיער יבש לחלוטין","הפכו את השיער והחלו למסרק בעדינות מהצוואר כלפי מעלה","תנערו את השיער ותפזרו אותו לחלקים","מסרקו כל חלק, החל מהשורש, כדי ליצור נפח וצורה","עובד נהדר עם תזדקקו למסרקי וולקרו שלנו כדי לשמור את החלקים במקומם בזמן שאתם מסרקים. הם חזקים אך גמישים ואינם גורמים נזק, ומאחיזים בקלות שיער עבה ומרקם. כשהשיער מעוצב, סיימו עם תרסיס שיער L3VEL3 להוספת ברק מבלי להכביד על התלתלים."]},{"t":"תכונות עיקריות","items":["עשויים מסטנדרטים מקצועיים של סלונים, מרזין עמיד ועמיד בחום","כולל מסרק דק ומסרק רחב שיתאימו לדפוסי תלתל שונים","קצוות מעוגלים שלא מעצבנים את הקרקפת או גורמים נזק לשיער בעת הפירוק והעיצוב","ידיות ארגונומיות נוחות להחזקה ולתפיסה קלה","מעצבים בעדינות ויוצרים נפח בשיער מתולתל, בעל מרקם ואפרו"]},{"t":"על המוצר","items":["המסרקים שלנו מפרידים בעדינות, מגדילים את הנפח ומעצב כל סוג של תלתלים טבעיים.","לתלתלים יש צורך בטיפול מיוחד כדי לשמור עליהם רכים, קופצניים וללא נזק. זה אומר שימוש במסרק המתאים, בין אם אתם ספרים שמטפלים בלקוח עם תלתלים ובין אם אתם בעלי כתר מתולתל גאה. סט מסרקי הייר פיק שלנו כולל שני עיצובים שונים המתאימים לכל סוג של תלתלים או שיער בעל מרקם. המסרקים עשויים רזין עמיד עם עמידות גבוהה לחום. עם גימור חלק וקצוות מעוגלים, הם מחליקים בקלות דרך השיער מבלי להיתקע או לגרום לנזק. בקצרה, המסרקים הללו מצוינים לפרמוט, הרמת שורשים, הגדלת נפח ועיצוב כללי."]}]},"ar":{"tag":"للشعر المجعد | 2 تصميم مختلف","sections":[{"t":"طريقة الاستخدام","items":["ابدأوا بشعر جاف تمامًا","اقلبوا الشعر وابدأوا التمشيط بلطف من الرقبة إلى الأعلى","انفضوا الشعر وقسّموه إلى أجزاء","مشّطوا كل جزء، بدءًا من الجذر، لصنع الحجم والشكل","يعمل بشكل رائع مع ستحتاجون إلى ماسكات الفيلكرو لدينا لتثبيت الأجزاء في مكانها أثناء التمشيط. هي قوية لكن مرنة ولا تسبب ضررًا، وتمسك الشعر الكثيف وذا الملمس بسهولة. وعندما ينتهي تصفيف الشعر، أنهوا مع بخاخ الشعر L3VEL3 لإضافة لمعان دون إثقال التجعيدات."]},{"t":"الميزات الرئيسية","items":["مصنوعة وفق معايير الصالونات الاحترافية، من راتنج متين ومقاوم للحرارة","يضم مشطًا رفيعًا ومشطًا عريضًا ليناسبا أنماط تجعيد مختلفة","أطراف مدوّرة لا تهيّج فروة الرأس ولا تضر الشعر أثناء الفك والتصفيف","مقابض مريحة للاستخدام سهلة الإمساك والتحكم","تصفف بلطف وتمنح حجمًا للشعر المجعد وذي الملمس والأفرو"]},{"t":"عن المنتج","items":["أمشاطنا تفصل بلطف، تزيد الحجم وتصفف كل أنواع التجعيد الطبيعي.","يحتاج الشعر المجعد إلى عناية خاصة ليبقى ناعمًا ونابضًا وبلا ضرر. وهذا يعني استخدام المشط المناسب، سواء كنتم حلاقين تتعاملون مع زبون ذي شعر مجعد أو أصحاب تاج مجعد تفتخرون به. طقم أمشاط هير بيك لدينا يضم تصميمين مختلفين يناسبان كل أنواع التجعيد أو الشعر ذي الملمس. الأمشاط مصنوعة من راتنج متين بمقاومة عالية للحرارة. بمظهر نهائي أملس وأطراف مدوّرة، تنزلق بسهولة خلال الشعر دون أن تعلق أو تسبب ضررًا. باختصار، هذه الأمشاط ممتازة لنفش الشعر ورفع الجذور وزيادة الحجم والتصفيف العام."]}]}},"מארז קליפסי פרפר — 4 יח":{"he":{"tag":"שיניים כפולות | קפיצים מחוזקים","sections":[{"t":"איך להשתמש","items":["לחצו על הקליפס עד שהלסתות נפתחות","קחו בזהירות את החלק של השיער בין השיניים של הקליפס","הפסיקו ללחוץ והתחילו להתרשם מהאחיזה החזקה","עכשיו, אתם יכולים להתחיל לעצב את השיער או פשוט להנות מהמראה שלכם","עובד נהדר עם… כדי לחלק חלקים מדויקים מוכנים לחיתוך, השתמשו בסט הקומבים המקצועי שלנו. כל אחד מתשעת הקומבים מאפשר לחלק ולחלק את השיער בקלות. סיימתם לייבש ולעצב? לוקחים את המראה ומוסיפים ברק עם התרסיס לשיער שלנו."]},{"t":"תכונות עיקריות","items":["חבילה של ארבעה קליפסים רב-תכליתיים לחיתוך ועיצוב השיער","כל צד כולל שיניים קשות ורכות עם קצוות מעוגלים","קפיצים מחוזקים לאחיזה חזקה ללא משיכה או הסתבכות","גודל גדול שמתאים לכל סוגי השיער, מרקמים ועוביים","קליפסים קלים אך עמידים לשימוש בבית ובסלון"]},{"t":"על המוצר","items":["L3VEL3 קליפס פרפר לשיער – 4 יחידות הסוד לשיער מושלם הוא ייבוש ועיצוב יעילים, ולכן חלוקת השיער לחלקים ניתנים לניהול היא חובה. כשאתם משתמשים במייבש שיער ובכלי עיצוב חמים, אתם זקוקים לקליפס פרפר שיכול להזיז ביעילות חלקים עיקשים בשיער. הקליפסים שלנו מעוצבים בצורה חכמה לאחוז בשיער חזק מבלי לגרום נזק או כאב לקרקפת. הם כוללים שיניים עם שני חורים ומנגנון קפיץ חזק להחזקת השיער, ללא קשר לעוביו. עם ארבעה קליפסים בחבילה, הם מושלמים לשימוש ביתי ומספרות, ולחיתוך או קישוט השיער."]}]},"ar":{"tag":"أسنان مزدوجة | نوابض مقوّاة","sections":[{"t":"طريقة الاستخدام","items":["اضغطوا على المشبك حتى تنفتح الفكوك","أدخلوا بحذر جزء الشعر بين أسنان المشبك","توقفوا عن الضغط وابدأوا بالانبهار بقوة التثبيت","الآن، يمكنكم البدء بتصفيف الشعر أو ببساطة الاستمتاع بمظهركم","يعمل بشكل رائع مع… لصنع أقسام دقيقة جاهزة للتثبيت، استخدموا طقم الأمشاط الاحترافي لدينا. كل واحد من الأمشاط التسعة يتيح تقسيم الشعر وفرزه بسهولة. انتهيتم من التجفيف والتصفيف؟ ارفعوا المظهر وأضيفوا لمعانًا مع بخاخ الشعر لدينا."]},{"t":"الميزات الرئيسية","items":["عبوة من أربعة مشابك متعددة الاستخدامات لتقسيم الشعر وتصفيفه","كل جانب يضم أسنانًا صلبة وأخرى ليّنة بأطراف مدوّرة","نوابض مقوّاة لتثبيت قوي دون شدّ أو تشابك","حجم كبير يناسب كل أنواع الشعر وملامسه وكثافاته","مشابك خفيفة لكنها متينة للاستخدام في البيت والصالون"]},{"t":"عن المنتج","items":["L3VEL3 مشبك الفراشة للشعر – 4 قطع. سرّ الشعر المثالي هو التجفيف والتصفيف الفعّالان، لذلك تقسيم الشعر إلى أجزاء يمكن التحكم بها أمر لا بد منه. عند استخدام مجفف الشعر وأدوات التصفيف الساخنة، تحتاجون إلى مشبك فراشة قادر على تحريك الأجزاء العنيدة من الشعر بفعالية. مشابكنا مصممة بذكاء لتمسك الشعر بقوة دون التسبب بضرر أو ألم لفروة الرأس. تتميز بأسنان بفتحتين وآلية نابض قوية لتثبيت الشعر مهما كانت كثافته. بأربعة مشابك في العبوة، هي مثالية للاستخدام المنزلي وللصالونات، ولتقسيم الشعر أو تزيينه."]}]}},"מארז קליפסי תנין — 4 יח":{"he":{"tag":"ציר כפול | אחיזה חזקה | אנטי-חלקה","sections":[{"t":"איך להשתמש","items":["הניחו את האצבע על הכרית החקוקה בקצה הקליפס","לחצו כלפי מטה לפתיחת הלסתות","החלקו בעדינות את הקליפס לתוך השיער כדי ליצור חלק מסודר","עובד נהדר עם חלק מדויק או חלוקה נכונה של שיער מתחילים עם מסרק איכותי. השתמשו בסט מסרקי ספר שלנו בן 9 חלקים כדי לסדר את שיער הלקוח לפני שתחזיקו אותו עם קליפס תנין. מוסיפים צבע? השתמשו בסט מברשות הטינט שלנו כדי למרוח את הדיו בצורה מדויקת ולסיים עם תוצאה מדהימה."]},{"t":"תכונות עיקריות","items":["חבילה של ארבעה קליפסים לשימוש בחיתוך ועיצוב השיער","עיצוב ציר כפול חדשני לאחיזה מעולה על כל סוגי השיער","גימור מאט אנטי-חלקה שמקל על העבודה עם הקליפסים","קומפקטיים וקלילים אך עמידים לאורך זמן, שימוש אחרי שימוש","ניתנים לשטיפה ולשימוש חוזר, מה שהופך אותם לאופציה חסכונית"]},{"t":"על המוצר","items":["קליפס תנין שלנו שומר את השיער מחוץ לדרך בזמן שאתם עושים את הקסם שלכם כמעצבי שיער.","שיער מגיע בכל מיני סוגים ומרקמים – ויש כאלה שפשוט לא מסכימים להיתפס. קליפסים רגילים לא מספיק חזקים או גדולים כדי להחזיק שיער עבה, מתולתל ובלתי מסודר. ללא אחיזה טובה, תמצאו את עצמכם נאבקים בחיתוך, עיצוב וביצוע עבודות מדויקות. אז כדי להתמודד עם שיער עמיד, השתמשו בקליפסים שלנו. קליפסי התנין שלנו כוללים מנגנון ציר כפול מיוחד שמחזיק את השיער הדק או העבה במקום. הגימור המאט מספק אחיזה אנטי-חלקה גם כשאתם לובשים כפפות ניטריל. עם ארבעה קליפסים בחבילה, אתם מסודרים לשירות הלקוחות שלכם."]}]},"ar":{"tag":"مفصل مزدوج | تثبيت قوي | مضاد للانزلاق","sections":[{"t":"طريقة الاستخدام","items":["ضعوا الإصبع على الوسادة المحفورة في طرف المشبك","اضغطوا للأسفل لفتح الفكوك","مرّروا المشبك بلطف داخل الشعر لصنع قسم مرتب","يعمل بشكل رائع مع القسم الدقيق أو التقسيم الصحيح للشعر يبدأ بمشط جيد. استخدموا طقم أمشاط الحلاق لدينا المكوّن من 9 قطع لترتيب شعر الزبون قبل تثبيته بمشبك التمساح. تضيفون صبغة؟ استخدموا طقم فرش الصبغة لدينا لتوزيع اللون بدقة والوصول إلى نتيجة مذهلة."]},{"t":"الميزات الرئيسية","items":["عبوة من أربعة مشابك للاستخدام في تقسيم الشعر وتصفيفه","تصميم مفصل مزدوج مبتكر لتثبيت ممتاز على كل أنواع الشعر","مظهر نهائي مطفي مضاد للانزلاق يسهّل العمل بالمشابك","صغيرة وخفيفة لكنها تدوم طويلًا، استخدامًا بعد استخدام","قابلة للغسل وإعادة الاستخدام، ما يجعلها خيارًا اقتصاديًا"]},{"t":"عن المنتج","items":["مشبك التمساح لدينا يُبعد الشعر عن الطريق بينما تصنعون سحركم كمصففي شعر.","الشعر يأتي بأنواع وملامس مختلفة – وبعضه ببساطة يرفض أن يُمسك. المشابك العادية ليست قوية أو كبيرة بما يكفي لتثبيت الشعر الكثيف والمجعد وغير المرتب. وبلا تثبيت جيد، ستجدون أنفسكم تصارعون في القص والتصفيف والأعمال الدقيقة. لذلك، للتعامل مع الشعر العنيد، استخدموا مشابكنا. مشابك التمساح لدينا تتميز بآلية مفصل مزدوج خاصة تثبّت الشعر الرفيع أو الكثيف في مكانه. المظهر النهائي المطفي يمنح تثبيتًا مضادًا للانزلاق حتى حين ترتدون قفازات نيتريل. بأربعة مشابك في العبوة، أنتم جاهزون لخدمة زبائنكم."]}]}},"מארז מחזיקי שיער — 4 יח":{"he":{"tag":"ולקרו גמיש | לכל סוג שיער","sections":[{"t":"איך להשתמש","items":["קחו מחזיק ואת חלק השיער שתרצו לאחוז.","הניחו את המחזיק על השיער ותנו לוולקרו לעשות את העבודה.","להסרה, פשוט החליקו את המחזיק מהשיער."]},{"t":"תכונות עיקריות","items":["עיצוב וולקרו: מחזיק חלקי שיער בצורה מסודרת ובטוחה.","גמישים אך חזקים: מתאימים לכל סוגי ומרקמי השיער.","ללא שיניים: מונעים נזק וקשרים בשיער.","גודל כף יד: מאפשר שימוש קל והסרה פשוטה על שיער יבש.","רחיצים וניתנים לשימוש חוזר: עמידים ונראים נהדר."]},{"t":"מפרט","items":["כולל: 4 מחזיקי שיער.","מידות: 11.4 ס\"מ אורך x 5 ס\"מ רוחב כל אחד."]}]},"ar":{"tag":"فيلكرو مرن | لكل أنواع الشعر","sections":[{"t":"طريقة الاستخدام","items":["خذوا ماسكًا وقسم الشعر الذي تريدون تثبيته.","ضعوا الماسك على الشعر ودعوا الفيلكرو يقوم بالعمل.","للإزالة، ببساطة مرّروا الماسك خارج الشعر."]},{"t":"الميزات الرئيسية","items":["تصميم فيلكرو: يثبّت أقسام الشعر بشكل مرتب وآمن.","مرنة لكن قوية: تناسب كل أنواع الشعر وملامسه.","بلا أسنان: تمنع الضرر والعقد في الشعر.","بحجم راحة اليد: تتيح استخدامًا سهلًا وإزالة بسيطة على الشعر الجاف.","قابلة للغسل وإعادة الاستخدام: متينة ومظهرها رائع."]},{"t":"المواصفات","items":["يشمل: 4 ماسكات شعر.","المقاسات: 11.4 سم طول x 5 سم عرض لكل واحدة."]}]}},"קערת צבע סיליקון ורודה":{"he":{"tag":"סיליקון גמיש | עמיד לכימיקלים","sections":[{"t":"איך להשתמש","items":["פרסו את הקערה למלוא הקיבולת.","מזגו פנימה צבע שיער באבקה, קרם או נוזל וערבבו בקלות.","החזיקו את הקערה ביד אחת בזמן שאתם מורחים צבע ביד השנייה.","שטפו את הקערה לאחר השימוש וקפלו אותה לאחסון."]},{"t":"תכונות עיקריות","items":["עשויה מסיליקון איכותי: גמיש, קל משקל ועמיד לשימוש לאורך זמן.","עמידה בפני אקונומיקה, כימיקלים וכתמים: שומרת על מראה חדש ונקי.","ללא מתכת: מונעת תגובות כימיות עם צבעי שיער ומבטיחה תוצאות צבע מושלמות.","בסיס נגד החלקה: מבטיח יציבות ומונע שפיכות.","מתקפלת ונוחה לאחסון: אידיאלית לשימוש מקצועי או ביתי."]},{"t":"מפרט","items":["מידות: 12.7 ס\"מ רוחב x 5 ס\"מ עומק.","צבעים זמינים: ורוד ושחור."]}]},"ar":{"tag":"سيليكون مرن | مقاوم للكيماويات","sections":[{"t":"طريقة الاستخدام","items":["افردوا الوعاء إلى كامل سعته.","اسكبوا فيه صبغة الشعر بودرة أو كريم أو سائل واخلطوا بسهولة.","أمسكوا الوعاء بيد واحدة بينما توزّعون الصبغة باليد الأخرى.","اغسلوا الوعاء بعد الاستخدام واطووه للتخزين."]},{"t":"الميزات الرئيسية","items":["مصنوع من سيليكون عالي الجودة: مرن وخفيف الوزن ويدوم طويلًا.","مقاوم للكلور والكيماويات والبقع: يحافظ على مظهر جديد ونظيف.","خالٍ من المعدن: يمنع التفاعلات الكيميائية مع صبغات الشعر ويضمن نتائج لون مثالية.","قاعدة مانعة للانزلاق: تضمن الثبات وتمنع الانسكاب.","قابل للطي وسهل التخزين: مثالي للاستخدام الاحترافي أو المنزلي."]},{"t":"المواصفات","items":["المقاسات: 12.7 سم عرض x 5 سم عمق.","الألوان المتوفرة: وردي وأسود."]}]}},"שפריצר גדול שחור":{"he":{"tag":"ריסוס אחיד | ניתן למילוי חוזר","sections":[{"t":"איך להשתמש","items":["מלאו את הבקבוק במים או טוניק לבחירתכם","לחצו בעדינות על ההדק ליצירת ריסוס רציף","אזורים גדולים יכוסו בצורה אחידה, תוך שמירה על תוצאות מצוינות"]},{"t":"תכונות עיקריות","items":["מייצר ריסוס רציף ודק במיוחד שמכסה אזורים גדולים במהירות","מפזר מים באופן אחיד, משפר את המשימה ומבטיח תוצאות מצוינות","בקבוק ארגונומי משולב, קל ונוח להחזקה לאורך זמן","ניתן למילוי מחדש ולשימוש חוזר, משלב פונקציונליות עם מראה יוקרתי","זמין בשחור, לבן וברור להתאמה לסגנון האישי שלכם"]},{"t":"על המוצר","items":["שפריצר השיער שלנו הוא השילוב המושלם בין חדשנות, ביצועים וסגנון. המטרה היא להרים את הרמה, ולכן פיתחנו שפריצר לשיער שמייעל את הדרך בה אתם עובדים ומעלה את חוויית הלקוחות. הבקבוק מתאים בצורה נוחה ביד ומספק ריסוס רציף וחזק עם מינימום מאמץ. בנוסף, הוא כולל עיצוב משולב שיבליט אתכם. כשיש לכם אזורים גדולים בשיער וסגנונות רבים לרסס, זה הזמן להגיע לשפריצר המנצח הזה."]}]},"ar":{"tag":"رذاذ متجانس | قابل لإعادة التعبئة","sections":[{"t":"طريقة الاستخدام","items":["املأوا الزجاجة بالماء أو بالتونيك حسب اختياركم","اضغطوا برفق على الزناد للحصول على رذاذ مستمر","تُغطى المساحات الكبيرة بشكل متجانس، مع الحفاظ على نتائج ممتازة"]},{"t":"الميزات الرئيسية","items":["ينتج رذاذًا مستمرًا وناعمًا جدًا يغطي مساحات كبيرة بسرعة","يوزّع الماء بشكل متجانس، يسهّل المهمة ويضمن نتائج ممتازة","زجاجة مريحة للاستخدام بتصميم مدمج، خفيفة ومريحة للإمساك لوقت طويل","قابل لإعادة التعبئة وللاستخدام المتكرر، يجمع بين الأداء والمظهر الفاخر","متوفر بالأسود والأبيض والشفاف ليناسب أسلوبكم الشخصي"]},{"t":"عن المنتج","items":["بخاخ الشعر لدينا هو المزيج المثالي بين الابتكار والأداء والأناقة. هدفنا رفع المستوى، لذلك طوّرنا بخاخ شعر يحسّن طريقة عملكم ويرتقي بتجربة الزبائن. الزجاجة تستقر بشكل مريح في اليد وتمنح رذاذًا مستمرًا وقويًا بأقل جهد. كما أنها بتصميم مدمج يميّزكم. عندما تكون أمامكم مساحات شعر كبيرة وتسريحات كثيرة للرش، فقد حان وقت هذا البخاخ الرابح."]}]}},"מארז מברשות צבע — 6 יח":{"he":{"tag":"זיפים איכותיים | ידיות ארגונומיות","sections":[{"t":"איך להשתמש","items":["בחרו את המברשת המתאימה למשימה הנוכחית.","השתמשו במברשת לערבוב הצבע וליישום על השיער.","הקפידו לנקות ולחטא את המברשות לאחר כל שימוש."]},{"t":"תכונות עיקריות","items":["כולל 6 מברשות שונות: לצביעת שיער, זקנים ועבודה מדויקת.","זיפים חזקים ועדינים: מתאימים ליישום מדויק אך שומרים על הקרקפת והעור.","ידיות עמידות ונוחות לאחיזה: עם גימור למניעת החלקה.","קצוות ידיות דקים: מאפשרים חלוקת שיער מדויקת ומהירה.","עיצוב מקצועי וביצועים מעולים: אידיאלי לערבוב ויישום צבעי שיער."]},{"t":"מפרט","items":["גדלים: 12 ס\"מ, 14 ס\"מ, 16 ס\"מ, 19.5 ס\"מ, 20 ס\"מ, 21.5 ס\"מ.","כולל: מברשת רחבה למקטעים גדולים, מברשת דקה לשורשים, מברשת קטנה לעבודה מדויקת, מברשת עבה לאורכי שיער, ומסרק צבע לצביעת זקן."]}]},"ar":{"tag":"شعيرات عالية الجودة | مقابض مريحة للاستخدام","sections":[{"t":"طريقة الاستخدام","items":["اختاروا الفرشاة المناسبة للمهمة الحالية.","استخدموا الفرشاة لخلط الصبغة وتطبيقها على الشعر.","احرصوا على تنظيف الفرش وتعقيمها بعد كل استخدام."]},{"t":"الميزات الرئيسية","items":["تشمل 6 فرش مختلفة: لصبغ الشعر واللحية وللعمل الدقيق.","شعيرات قوية وناعمة: مناسبة للتطبيق الدقيق مع الحفاظ على فروة الرأس والبشرة.","مقابض متينة ومريحة للإمساك: بتشطيب مانع للانزلاق.","أطراف مقابض رفيعة: تتيح تقسيم الشعر بدقة وسرعة.","تصميم احترافي وأداء ممتاز: مثالي لخلط صبغات الشعر وتطبيقها."]},{"t":"المواصفات","items":["المقاسات: 12 سم، 14 سم، 16 سم، 19.5 سم، 20 سم، 21.5 سم.","تشمل: فرشاة عريضة للأقسام الكبيرة، فرشاة رفيعة للجذور، فرشاة صغيرة للعمل الدقيق، فرشاة سميكة لأطوال الشعر، ومشط صبغة لصبغ اللحية."]}]}},"מארז מברשות לצוואר — 2 יח":{"he":{"tag":"זיפים צפופים | ידיות רזין","sections":[{"t":"תכונות עיקריות","items":["• זיפים רכים במיוחד שמסירים שערות מבלי לגרות את העור","• ידיות עשויות רזין (resin) עמיד במיוחד – עמידות למים וקלות לחיטוי","• עיצוב ארגונומי לנוחות אחיזה ושליטה טובה","• בסיס יציב שמאפשר להעמיד את המברשת – בלי צורך במעמד","• איכות מקצועית במחיר משתלם – 2 מברשות בחבילה"]},{"t":"על המוצר","items":["מברשות הצוואר המקצועיות שלנו רכות, יעילות וקלות לחיטוי.","השלב האחרון בכל תספורת הוא סילוק השערות הרופפות מצוואר הלקוח – זה מה שנותן גימור נקי, מדגיש את הדיוק בעבודה שלך ומשדר תשומת לב מקצועית לפרטים. כדי להסיר בעדינות כל שערה מיותרת, השתמש בסט מברשות הצוואר שלנו. כל מברשת עשויה באיכות גבוהה, לעמידות ויעילות, ובסט של שתיים – אתה גם מקבל תמורה מעולה."]},{"t":"מידות","items":["• מברשת אחת בגובה 5 אינץ' (כ־12.7 ס\"מ)","• מברשת שנייה בגובה 6 אינץ' (כ־15.2 ס\"מ)"]}]},"ar":{"tag":"شعيرات كثيفة | مقابض ريزين","sections":[{"t":"الميزات الرئيسية","items":["• شعيرات فائقة النعومة تزيل الشعر دون تهييج البشرة","• مقابض من ريزين (resin) فائق المتانة – مقاومة للماء وسهلة التعقيم","• تصميم مريح للاستخدام لقبضة مريحة وتحكم جيد","• قاعدة ثابتة تتيح وقوف الفرشاة – دون الحاجة إلى حامل","• جودة احترافية بسعر مجزٍ – 2 فرشاة في العبوة"]},{"t":"عن المنتج","items":["فرش الرقبة الاحترافية لدينا ناعمة وفعّالة وسهلة التعقيم.","الخطوة الأخيرة في كل قصّة شعر هي إزالة الشعر المتناثر عن رقبة الزبون – هذا ما يمنح مظهرًا نهائيًا نظيفًا، ويُبرز دقة عملك، ويعكس اهتمامًا احترافيًا بالتفاصيل. لإزالة كل شعرة زائدة بلطف، استخدم طقم فرش الرقبة لدينا. كل فرشاة مصنوعة بجودة عالية، للمتانة والفعالية، وفي طقم من قطعتين – تحصل أيضًا على قيمة ممتازة."]},{"t":"المقاسات","items":["• فرشاة بارتفاع 5 إنش (نحو 12.7 سم)","• فرشاة ثانية بارتفاع 6 إنش (نحو 15.2 سم)"]}]}},"מברשת יד רכה עם ידית":{"he":{"tag":"לפיידים ופרטים עדינים | עץ אבוני","sections":[{"t":"איך להשתמש","items":["אחזו את המברשת ביד עם האצבעות משולבות בעיקולים הארגונומיים.","הברישו בעדינות שיער עודף מהאזור שבו אתם עובדים.","הקפידו לנקות ולחטא את המברשת לאחר כל שימוש."]},{"t":"תכונות עיקריות","items":["עיצוב קומפקטי ורב-שימושי: לניקוי שיער מהיר ויעיל בזמן עבודה על פרטים.","זיפים רכים אך יציבים: מסירים שיער בקלות מבלי לגרום לגירוי עור.","גוף וידית מעץ אבוני: מצופה גימור מט למניעת החלקה ושיפור אחיזה.","צורה מותאמת ליד: מאפשרת שליטה יוצאת דופן ונוחות מירבית.","מושלמת לניקוי עור בפיידים ולעבודה אחרונה אחרי תספורות."]},{"t":"מפרט","items":["מידות גוף המברשת: 17.8 ס\"מ אורך x 5 ס\"מ רוחב."]}]},"ar":{"tag":"للفيد والتفاصيل الدقيقة | خشب الأبنوس","sections":[{"t":"طريقة الاستخدام","items":["أمسكوا الفرشاة باليد مع وضع الأصابع في الانحناءات المريحة.","أزيلوا بالفرشاة بلطف الشعر الزائد من المنطقة التي تعملون عليها.","احرصوا على تنظيف الفرشاة وتعقيمها بعد كل استخدام."]},{"t":"الميزات الرئيسية","items":["تصميم مدمج ومتعدد الاستخدامات: لتنظيف الشعر بسرعة وفعالية أثناء العمل على التفاصيل.","شعيرات ناعمة لكنها ثابتة: تزيل الشعر بسهولة دون التسبب بتهيّج البشرة.","جسم ومقبض من خشب الأبنوس: بطبقة مطفية لمنع الانزلاق وتحسين القبضة.","شكل ملائم لليد: يتيح تحكمًا استثنائيًا وراحة قصوى.","مثالية لتنظيف البشرة في الفيد وللمسة الأخيرة بعد القصّات."]},{"t":"المواصفات","items":["مقاسات جسم الفرشاة: 17.8 سم طول x 5 سم عرض."]}]}},"מברשת אצבע":{"he":{"tag":"לניקוי מהיר | עיצוב ארגונומי","sections":[{"t":"איך להשתמש","items":["הכניסו את האצבעות לידית הלולאה והחזיקו את המברשת בכף היד.","ודאו שהזיפים פונים החוצה מעל הפרקים.","הברישו בעדינות שיער עודף תוך כדי עבודה או בסיום התספורת."]},{"t":"תכונות עיקריות","items":["ידית לולאה מותאמת לאצבעות: לנוחות ושימוש קל במהלך העבודה.","זיפים רכים מניילון 100%: מסירים שיער עודף בקלות מבלי לגרום לגירוי בעור.","עיצוב מיוחד: מייעל את ניקוי השיער במהלך פיידים ועבודות דיוק.","גוף מעוצב מעץ אבוני מבריק: עם גימור גומי למניעת החלקה.","שימוש רב-תכליתי: מתאים גם כמברשת לזקנים ולניקוי ראשי קליפרים."]},{"t":"מפרט","items":["מידות: 5.7 ס\"מ רוחב x 8.9 ס\"מ אורך (כולל הידית)."]}]},"ar":{"tag":"لتنظيف سريع | تصميم مريح للاستخدام","sections":[{"t":"طريقة الاستخدام","items":["أدخلوا الأصابع في المقبض الحلقي وأمسكوا الفرشاة براحة اليد.","تأكدوا أن الشعيرات متجهة للخارج فوق المفاصل.","أزيلوا بالفرشاة بلطف الشعر الزائد أثناء العمل أو عند انتهاء القصّة."]},{"t":"الميزات الرئيسية","items":["مقبض حلقي ملائم للأصابع: للراحة وسهولة الاستخدام أثناء العمل.","شعيرات ناعمة من نايلون 100%: تزيل الشعر الزائد بسهولة دون التسبب بتهيّج البشرة.","تصميم خاص: يجعل تنظيف الشعر أكثر كفاءة أثناء الفيد وأعمال الدقة.","جسم مصمم من خشب الأبنوس اللامع: بطبقة مطاطية لمنع الانزلاق.","استخدام متعدد: تصلح أيضًا كفرشاة للّحية ولتنظيف رؤوس ماكينات الحلاقة."]},{"t":"المواصفات","items":["المقاسات: 5.7 سم عرض x 8.9 سم طول (شامل المقبض)."]}]}},"מארז מברשות לפנים — דו":{"he":{"tag":"ליישום מסכות וסרומים","sections":[{"t":"איך להשתמש","items":["מרחו את המוצר על זיפי המברשת.","החליקו בעדינות את המוצר על המצח והלחיים.","השתמשו בקצות המברשת לכיסוי אזורים קטנים כמו סביב האף והפה.","הקפידו לשטוף ולחטא את המברשות לאחר כל שימוש.","המברשות המושלמות לטיפוח עור DIY או מקצועי!"]},{"t":"תכונות עיקריות","items":["זיפים חזקים ורכים: מחליקים בעדינות על העור ואינם נשירים.","קצוות שטוחים ועגולים: מתאימים לכיסוי שטחים גדולים ולפינות מסביב לאף.","ידיות נוחות לאחיזה: מאפשרות שליטה טובה יותר ודיוק.","כולל שני מברשות: לנוחות ותמורה מעולה.","מתאימות ליישום מסכות פנים, סרומים, פילינגים ועוד."]},{"t":"מפרט","items":["מידות: 12.7 ס\"מ ו-15.2 ס\"מ אורך.","כולל: שתי מברשות ליישום מסכות פנים."]}]},"ar":{"tag":"لتطبيق الماسكات والسيرومات","sections":[{"t":"طريقة الاستخدام","items":["وزّعوا المنتج على شعيرات الفرشاة.","مرّروا المنتج بلطف على الجبين والخدين.","استخدموا أطراف الفرشاة لتغطية المناطق الصغيرة مثل محيط الأنف والفم.","احرصوا على غسل الفرش وتعقيمها بعد كل استخدام.","الفرش المثالية للعناية بالبشرة DIY أو الاحترافية!"]},{"t":"الميزات الرئيسية","items":["شعيرات قوية وناعمة: تنزلق بلطف على البشرة ولا تتساقط.","أطراف مسطحة ومستديرة: تناسب تغطية المساحات الكبيرة والزوايا حول الأنف.","مقابض مريحة للقبضة: تتيح تحكمًا أفضل ودقة.","تشمل فرشاتين: للراحة وقيمة ممتازة.","مناسبة لتطبيق ماسكات الوجه والسيرومات والمقشّرات وغيرها."]},{"t":"المواصفات","items":["المقاسات: 12.7 سم و 15.2 سم طول.","يشمل: فرشاتين لتطبيق ماسكات الوجه."]}]}},"קערת צבע סיליקון שחורה":{"he":{"tag":"סיליקון גמיש | עמיד לכימיקלים","sections":[{"t":"איך להשתמש","items":["פרסו את הקערה למלוא הקיבולת.","מזגו פנימה צבע שיער באבקה, קרם או נוזל וערבבו בקלות.","החזיקו את הקערה ביד אחת בזמן שאתם מורחים צבע ביד השנייה.","שטפו את הקערה לאחר השימוש וקפלו אותה לאחסון."]},{"t":"תכונות עיקריות","items":["עשויה מסיליקון איכותי: גמיש, קל משקל ועמיד לשימוש לאורך זמן.","עמידה בפני אקונומיקה, כימיקלים וכתמים: שומרת על מראה חדש ונקי.","ללא מתכת: מונעת תגובות כימיות עם צבעי שיער ומבטיחה תוצאות צבע מושלמות.","בסיס נגד החלקה: מבטיח יציבות ומונע שפיכות.","מתקפלת ונוחה לאחסון: אידיאלית לשימוש מקצועי או ביתי."]},{"t":"מפרט","items":["מידות: 12.7 ס\"מ רוחב x 5 ס\"מ עומק.","צבעים זמינים: ורוד ושחור."]}]},"ar":{"tag":"سيليكون مرن | مقاوم للكيماويات","sections":[{"t":"طريقة الاستخدام","items":["افردوا الوعاء إلى كامل سعته.","اسكبوا فيه صبغة الشعر بودرة أو كريم أو سائل واخلطوا بسهولة.","أمسكوا الوعاء بيد واحدة بينما توزّعون الصبغة باليد الأخرى.","اغسلوا الوعاء بعد الاستخدام واطووه للتخزين."]},{"t":"الميزات الرئيسية","items":["مصنوع من سيليكون عالي الجودة: مرن وخفيف الوزن ويدوم طويلًا.","مقاوم للكلور والكيماويات والبقع: يحافظ على مظهر جديد ونظيف.","خالٍ من المعدن: يمنع التفاعلات الكيميائية مع صبغات الشعر ويضمن نتائج لون مثالية.","قاعدة مانعة للانزلاق: تضمن الثبات وتمنع الانسكاب.","قابل للطي وسهل التخزين: مثالي للاستخدام الاحترافي أو المنزلي."]},{"t":"المواصفات","items":["المقاسات: 12.7 سم عرض x 5 سم عمق.","الألوان المتوفرة: وردي وأسود."]}]}},"שפריצר גדול לבן":{"he":{"tag":"ריסוס אחיד | ניתן למילוי חוזר","sections":[{"t":"איך להשתמש","items":["מלאו את הבקבוק במים או טוניק לבחירתכם","לחצו בעדינות על ההדק ליצירת ריסוס רציף","אזורים גדולים יכוסו בצורה אחידה, תוך שמירה על תוצאות מצוינות","עובד נהדר עם הגנו על פני הלקוח ועיניו עם מגן פנים יעיל. אמנם הוא דק וקל משקל, אך הוא מונע ריסוס שיכול להיכנס לעיניים או לגרום לגירוי. כשהשיער לח, השתמשו בסט הקומבים שלנו כדי ליצור את החלוקה המושלמת."]},{"t":"תכונות עיקריות","items":["מייצר ריסוס רציף ודק במיוחד שמכסה אזורים גדולים במהירות","מפזר מים באופן אחיד, משפר את המשימה ומבטיח תוצאות מצוינות","בקבוק ארגונומי משולב, קל ונוח להחזקה לאורך זמן","ניתן למילוי מחדש ולשימוש חוזר, משלב פונקציונליות עם מראה יוקרתי","זמין בשחור, לבן וברור להתאמה לסגנון האישי שלכם"]},{"t":"על המוצר","items":["שפריצר השיער שלנו הוא השילוב המושלם בין חדשנות, ביצועים וסגנון. המטרה היא להרים את הרמה, ולכן פיתחנו שפריצר לשיער שמייעל את הדרך בה אתם עובדים ומעלה את חוויית הלקוחות. הבקבוק מתאים בצורה נוחה ביד ומספק ריסוס רציף וחזק עם מינימום מאמץ. בנוסף, הוא כולל עיצוב משולב שיבליט אתכם. כשיש לכם אזורים גדולים בשיער וסגנונות רבים לרסס, זה הזמן להגיע לשפריצר המנצח הזה."]}]},"ar":{"tag":"رذاذ متجانس | قابل لإعادة التعبئة","sections":[{"t":"طريقة الاستخدام","items":["املأوا الزجاجة بالماء أو بالتونيك حسب اختياركم","اضغطوا برفق على الزناد للحصول على رذاذ مستمر","تُغطى المساحات الكبيرة بشكل متجانس، مع الحفاظ على نتائج ممتازة","يعمل بشكل رائع مع احموا وجه الزبون وعينيه بواقي وجه فعّال. هو رفيع وخفيف الوزن، لكنه يمنع الرذاذ من دخول العينين أو التسبب بتهيّج. وعندما يكون الشعر رطبًا، استخدموا طقم الأمشاط لدينا لعمل التقسيم المثالي."]},{"t":"الميزات الرئيسية","items":["ينتج رذاذًا مستمرًا وناعمًا جدًا يغطي مساحات كبيرة بسرعة","يوزّع الماء بشكل متجانس، يسهّل المهمة ويضمن نتائج ممتازة","زجاجة مريحة للاستخدام بتصميم مدمج، خفيفة ومريحة للإمساك لوقت طويل","قابل لإعادة التعبئة وللاستخدام المتكرر، يجمع بين الأداء والمظهر الفاخر","متوفر بالأسود والأبيض والشفاف ليناسب أسلوبكم الشخصي"]},{"t":"عن المنتج","items":["بخاخ الشعر لدينا هو المزيج المثالي بين الابتكار والأداء والأناقة. هدفنا رفع المستوى، لذلك طوّرنا بخاخ شعر يحسّن طريقة عملكم ويرتقي بتجربة الزبائن. الزجاجة تستقر بشكل مريح في اليد وتمنح رذاذًا مستمرًا وقويًا بأقل جهد. كما أنها بتصميم مدمج يميّزكم. عندما تكون أمامكم مساحات شعر كبيرة وتسريحات كثيرة للرش، فقد حان وقت هذا البخاخ الرابح."]}]}},"שפריצר גדול לבן שקוף":{"he":{"tag":"ריסוס אחיד | שקוף | ניתן למילוי חוזר","sections":[{"t":"איך להשתמש","items":["מלאו את הבקבוק במים או טוניק לבחירתכם","לחצו בעדינות על ההדק ליצירת ריסוס רציף","אזורים גדולים יכוסו בצורה אחידה, תוך שמירה על תוצאות מצוינות","עובד נהדר עם הגנו על פני הלקוח ועיניו עם מגן פנים יעיל. אמנם הוא דק וקל משקל, אך הוא מונע ריסוס שיכול להיכנס לעיניים או לגרום לגירוי. כשהשיער לח, השתמשו בסט הקומבים שלנו כדי ליצור את החלוקה המושלמת."]}, ח להחזיק את המגן מול הפנים.","רססו את המוצר הרצוי על השיער כשהמגן שומר על הפנים.","נקו את המגן אחרי כל שימוש לשמירה על היגיינה ועמידות.","עובד מעולה עם…","למראה מושלם, השתמשו עם L3VEL3 Hair Spray . שמרו על ניקיון הלקוחות עם L3VEL3 Professional Hair Cutting Cape , והגנו על עצמכם עם L3VEL3 Professional Barber Apron ."]},{"t":"תכונות עיקריות","items":["הגנה מלאה: מגן על הפנים מפני ספריי לשיער, ספריי צבע ועוד.","שירות ללא גירויים: מונע מגע של מוצרי ריסוס עם העיניים, האף, הפה והעור.","קל משקל ונוח: קל להחזיק אותו לפרקי זמן ארוכים ללא מאמץ.","עיצוב עמיד: ידית מרופדת בקצף רך מבטיחה אחיזה נוחה ובטוחה.","מעוצב בסטייל ובפונקציונליות: פרופיל דק לאחסון נוח ועיצוב מודרני."]},{"t":"על המוצר","items":["מגן הפנים L3VEL3 מבטיח את הנוחות והבטיחות של הלקוחות במהלך עיצוב השיער. המגן עוצב במיוחד כדי להגן על הפנים מפני מוצרי ריסוס כמו ספריי לשיער, סיבי שיער, וספריי צבע. הכלי הזה, שהוא קל משקל ויעיל, משדרג את השירות שלכם תוך שמירה על הלקוחות מפני גירויים. מעוצב בסטייל, עמיד ונוח לשימוש – זהו פריט חובה עבור ספרים וסטייליסטים ששמים את שביעות רצון הלקוח בראש סדר העדיפויות."]}]},"ar":{"tag":"حماية من البخاخ والصبغة والألياف | مقبض مبطّن","sections":[{"t":"طريقة الاستخدام","items":["دعوا الزبون يمسك الواقي أمام الوجه.","رشّوا المنتج المطلوب على الشعر بينما يحمي الواقي الوجه.","نظّفوا الواقي بعد كل استخدام حفاظًا على النظافة والمتانة.","يعمل بشكل ممتاز مع…","لمظهر مثالي، استخدموه مع L3VEL3 Hair Spray . حافظوا على نظافة الزبائن مع L3VEL3 Professional Hair Cutting Cape ، واحموا أنفسكم مع L3VEL3 Professional Barber Apron ."]},{"t":"الميزات الرئيسية","items":["حماية كاملة: يحمي الوجه من سبراي الشعر وسبراي الصبغة وغيرها.","خدمة بلا تهيّج: يمنع ملامسة منتجات الرش للعينين والأنف والفم والبشرة.","خفيف ومريح: سهل الإمساك لفترات طويلة دون جهد.","تصميم متين: مقبض مبطّن بإسفنج ناعم يضمن قبضة مريحة وآمنة.","أناقة وعملية معًا: هيكل رفيع لتخزين مريح وتصميم عصري."]},{"t":"عن المنتج","items":["يضمن واقي الوجه L3VEL3 راحة الزبائن وسلامتهم أثناء تصفيف الشعر. صُمّم الواقي خصيصًا لحماية الوجه من منتجات الرش مثل سبر
